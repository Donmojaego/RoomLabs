<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaleidoscope · Room Labs Audio</title>
<style>
/* =============================================================================
   Kaleidoscope — 4 habillages peints par Room Labs (assets/<layout>_*.webp), un seul DOM.
   Scène 1000 x 1083 (proportions du châssis 2000 x 2166). Le kaléidoscope est dessiné SOUS le châssis,
   visible par l'ouverture ; le cadre optique est posé par-dessus. Tous les textes sont écrits par le code.
   Placement de chaque groupe : GEOM dans app.js.
   ============================================================================= */
:root{--ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
[data-layout=retro]{--bg:radial-gradient(ellipse at 50% 40%,#3a1d0c,#140a04 75%);--ink:#4a2a10;--inkL:#7a5530;--inkD:#f6dfb0;--inkD2:#d8b27a;--acc:#ff9a2e;--glow:rgba(255,160,60,.6);
  --menu:#24140a;--menuInk:#f6dfb0;--line:#c08a45;--title:"Georgia","Times New Roman",serif;--win:#3b2410;--winInk:#4a2a10;--btnInk:#fff3d6;--btnInkOff:#f0c98a}
[data-layout=labo]{--bg:radial-gradient(ellipse at 50% 40%,#e9eef1,#b9c3c9 80%);--ink:#33424c;--inkL:#6c7f8b;--inkD:#33424c;--inkD2:#6c7f8b;--acc:#16c3c9;--glow:rgba(22,195,201,.5);
  --menu:#f4f7f8;--menuInk:#25333c;--line:#9fb3bd;--title:var(--ui);--win:#e7edf0;--winInk:#2c3a44;--btnInk:#1d6f78;--btnInkOff:#4d5d68}
[data-layout=holo]{--bg:radial-gradient(ellipse at 50% 40%,#151a4a,#04050f 75%);--ink:#d9f6ff;--inkL:#8fb6dd;--inkD:#d9f6ff;--inkD2:#8fb6dd;--acc:#33dcff;--glow:rgba(50,220,255,.6);
  --menu:#0b1032;--menuInk:#d9f6ff;--line:#3a8fd6;--title:var(--ui);--win:#0a1030;--winInk:#cdefff;--btnInk:#c9f7ff;--btnInkOff:#c3a8ff}
[data-layout=telescope]{--bg:radial-gradient(ellipse at 35% 40%,#3b1d4e,#0d0712 75%);--ink:#f6dfa8;--inkL:#c8a56c;--inkD:#f6dfa8;--inkD2:#c8a56c;--acc:#ff9a2e;--glow:rgba(255,120,220,.5);
  --menu:#22140c;--menuInk:#f6dfa8;--line:#c99a45;--title:"Georgia","Times New Roman",serif;--win:#24150c;--winInk:#f6dfa8;--btnInk:#fff3d6;--btnInkOff:#f0c98a}

*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:var(--ui)}
#stage{position:absolute;left:0;top:0;width:1000px;height:1083px;transform-origin:0 0;overflow:hidden;background:var(--bg);color:var(--ink)}
#skin{position:absolute;inset:0;transition:opacity .3s ease}
#stage.switching #skin{opacity:0}
img{-webkit-user-drag:none}

#kWrap{position:absolute;border-radius:50%;overflow:hidden;background:#000;z-index:1}
#kcanvas{position:absolute;inset:0;width:100%;height:100%}
#chassis{position:absolute;left:0;top:0;width:1000px;height:1083px;z-index:2;pointer-events:none}
#cadre{position:absolute;z-index:3;pointer-events:none}
#roll{position:absolute;z-index:4;cursor:grab;overflow:hidden}
#rollCv{position:absolute;inset:0;width:100%;height:100%}
#lensInfo{position:absolute;z-index:4;text-align:center;font-size:12px;letter-spacing:1.2px;color:#fff;text-shadow:0 1px 3px #000,0 0 8px #000;pointer-events:none;white-space:nowrap}
#refBadge{position:absolute;z-index:4;font-size:12px;font-weight:700;letter-spacing:1px;color:#111;background:#ffd36b;border-radius:9px;padding:2px 8px;opacity:0;transition:opacity .25s;pointer-events:none;transform:translateX(-50%)}
#refBadge.show{opacity:.92}

.grp{position:absolute;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center}
.row{display:flex;align-items:center;justify-content:center}

#gLogo{align-items:flex-start;line-height:1}
#gLogo b{font-family:var(--title);font-size:30px;letter-spacing:4px;font-weight:700;color:var(--inkD);display:block}
#gLogo small{display:block;font-size:12px;letter-spacing:3.4px;margin-top:5px;color:var(--inkD2)}
[data-layout=retro] #gLogo b,[data-layout=telescope] #gLogo b{background:linear-gradient(180deg,#fff0c4,#e3a64a 60%,#b0701c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 1px rgba(0,0,0,.7))}
[data-layout=holo] #gLogo b{font-weight:300;letter-spacing:9px;font-size:26px;text-shadow:0 0 12px rgba(60,210,255,.85)}
[data-layout=labo] #gLogo b{font-weight:300;letter-spacing:8px;font-size:26px;color:#2b3a44}
[data-layout=labo] #gLogo small{color:#16a5ab}

.ia{position:relative;flex:none;cursor:pointer}
.ia>img.bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:filter .15s}
.ia:hover>img.bg{filter:brightness(1.07) drop-shadow(0 0 6px var(--glow))}
.ia:active>img.bg{filter:brightness(.92)}
.win{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;white-space:nowrap;color:var(--winInk);font-weight:700;pointer-events:none;line-height:1.1;font-size:13px;padding:0 4px}
.win.cover{background:var(--win);border-radius:9px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.win .lab{font-size:11px;letter-spacing:1.3px;opacity:.7;margin-right:6px;font-weight:800;text-transform:uppercase;flex:none}
.win .val{overflow:hidden;text-overflow:ellipsis}
.tab{position:absolute;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;pointer-events:none;border-radius:5px;white-space:nowrap}
.hot{position:absolute;cursor:pointer;border-radius:8px}
.hot:hover{background:rgba(255,255,255,.14)}

.pill .win{letter-spacing:2px;text-transform:uppercase;color:var(--btnInkOff);font-weight:800}
.pill.on .win{color:var(--btnInk);text-shadow:0 1px 2px rgba(0,0,0,.45)}
[data-layout=retro] .pill .win,[data-layout=telescope] .pill .win{font-family:"Trebuchet MS",var(--ui);text-shadow:0 2px 1px rgba(0,0,0,.6)}
[data-layout=retro] .pill.on .win,[data-layout=telescope] .pill.on .win{color:#fff1cf}
[data-layout=labo] .pill .win{text-shadow:none;color:#5b6a75}
[data-layout=labo] .pill.on .win{color:#127d84}
[data-layout=holo] .pill.on .win{color:#a8f4ff;text-shadow:0 0 10px #33dcff}
[data-layout=holo] .pill .win{color:#c4a9ff;text-shadow:0 0 8px rgba(160,110,255,.6)}
.pill img.bg{transition:opacity .22s,filter .15s}
.pill img.on{opacity:0}.pill.on img.on{opacity:1}.pill.on img.off{opacity:0}

.cap-lbl{font-size:12px;font-weight:800;letter-spacing:0;text-transform:uppercase;color:var(--ink);text-align:center;margin-top:2px;white-space:nowrap}
.dark .cap-lbl{color:var(--inkD)}
.rb{display:flex;flex-direction:column;align-items:center;flex:none}
.rb .ia{border-radius:50%;transition:box-shadow .25s}
.rb.on .ia{box-shadow:0 0 0 3px var(--acc),0 0 18px var(--glow)}
#genBtn.flash img.bg{animation:genFlash .55s ease-out}
@keyframes genFlash{0%{filter:brightness(1.55) drop-shadow(0 0 20px var(--glow))}}

.kn{display:flex;flex-direction:column;align-items:center;cursor:ns-resize;touch-action:none;flex:none}
.kn .ring{position:relative}
.kn .ring img{position:absolute;pointer-events:none}
.kn .capi{will-change:transform}
.kn:hover .ring{filter:brightness(1.08)}
.kn .k-lbl{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--inkD);text-transform:uppercase;margin-top:1px;white-space:nowrap}
.kn .k-val{font-size:12px;color:var(--inkD2);height:14px;white-space:nowrap;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .2s}
.kn:hover .k-val,.kn.drag .k-val{opacity:1}
[data-layout=labo] .kn .k-lbl{color:#33424c}[data-layout=labo] .kn .k-val{color:#6c7f8b}

.tg{display:flex;align-items:center;gap:6px;cursor:pointer;flex:none}
.tg span{font-size:12px;font-weight:800;letter-spacing:1.1px;color:var(--inkD);text-transform:uppercase;white-space:nowrap}
.tg .ia img.bg{transition:opacity .2s}
.tg .ia img.on{opacity:0}.tg.on .ia img.on{opacity:1}.tg.on .ia img.off{opacity:0}
[data-layout=labo] .tg span{color:#33424c}

#masterWrap{cursor:ew-resize;touch-action:none}
#masterWrap.dial{cursor:ns-resize}
#masterWrap .thumb,#masterWrap .mcap{position:absolute;pointer-events:none;will-change:transform}
#masterWrap .mval{position:absolute;font-size:12px;font-weight:700;color:var(--inkD);text-shadow:0 1px 2px #000;white-space:nowrap;pointer-events:none;display:flex;align-items:center;justify-content:center}
#masterWrap .mval.cover{background:#1a0f08;border-radius:8px}
#masterLbl{position:absolute;font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--inkD);pointer-events:none;white-space:nowrap}
[data-layout=labo] #masterWrap .mval,[data-layout=labo] #masterLbl{color:#33424c;text-shadow:none}

.tb{flex:1 1 auto;height:30px;border:0;border-radius:15px;cursor:pointer;font:700 12px var(--ui);letter-spacing:.3px;padding:0 9px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px;
  transition:transform .08s,box-shadow .15s,background .15s;color:var(--inkD);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.25));box-shadow:0 0 0 1px var(--line),0 2px 4px rgba(0,0,0,.35)}
.tb:hover{box-shadow:0 0 0 1px var(--acc),0 0 12px var(--glow)}
.tb:active{transform:translateY(1px)}
.tb.on{background:var(--acc);color:#1a0f05}
.tb svg{width:14px;height:14px;flex:none}
[data-layout=retro] .light .tb{color:#4a2a10;background:linear-gradient(180deg,#fff7e6,#ead6b0);box-shadow:0 0 0 1px #c49a5e,0 1px 3px rgba(0,0,0,.25)}
[data-layout=retro] .dark .tb{color:#fbe6bd;background:linear-gradient(180deg,#6a3e1c,#2e170a);box-shadow:0 0 0 1px #c99a45,0 2px 4px rgba(0,0,0,.5)}
[data-layout=retro] .light .tb.on,[data-layout=labo] .tb.on{background:var(--acc);color:#1a0f05}
[data-layout=labo] .tb{color:#2f3e48;background:linear-gradient(180deg,#ffffff,#dfe6ea);box-shadow:0 0 0 1px #a9bcc6,0 1px 3px rgba(0,0,0,.18)}
[data-layout=holo] .tb{color:#d9f6ff;background:linear-gradient(180deg,rgba(40,70,150,.55),rgba(10,16,50,.85));box-shadow:0 0 0 1px rgba(60,200,255,.55),0 0 10px rgba(60,200,255,.2)}
[data-layout=telescope] .tb{color:#f6dfa8;background:linear-gradient(180deg,#5a3a1c,#2a180c);box-shadow:0 0 0 1px #c99a45,0 2px 4px rgba(0,0,0,.5)}
.tsel{flex:1 1 auto;height:30px;border-radius:15px;cursor:pointer;font:700 12px var(--ui);display:flex;align-items:center;justify-content:center;padding:0 10px;white-space:nowrap;overflow:hidden}

.scope{position:relative;border-radius:8px;background:rgba(0,0,0,.45);box-shadow:inset 0 2px 6px rgba(0,0,0,.6);overflow:hidden;flex:none}
[data-layout=labo] .scope{background:#1b2a33}
.scope canvas{width:100%;height:100%;display:block}
.bankLine{font-size:12px;color:var(--inkD);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.35;min-width:0}
.bankLine b{font-size:13px}
[data-layout=labo] .bankLine{color:#33424c}

#dropZone{position:absolute;left:0;right:0;top:0;border-radius:12px;border:2px dashed var(--acc);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  font-size:12px;color:var(--ink);cursor:pointer;padding:4px 6px;line-height:1.3;background:rgba(128,128,128,.12);z-index:2}
#dropZone b{font-size:13px}
#dropZone.over{background:rgba(255,180,80,.3)}
.dropMode #dropZone{display:flex}
.dropMode:not(.analysed) #tonRow1{visibility:hidden}
.dropMode.analysed #dropZone{display:none}

#veil{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#veil.show{opacity:1;pointer-events:auto}
.pop{position:absolute;z-index:60;border-radius:12px;background:var(--menu);color:var(--menuInk);box-shadow:0 0 0 1px var(--line),0 14px 40px rgba(0,0,0,.6);
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .16s ease,transform .16s ease;padding:8px;overflow:auto}
.pop.show{opacity:1;transform:none;pointer-events:auto}
.pop h4{margin:6px 8px 4px;font-size:12px;letter-spacing:1.6px;color:var(--acc);text-transform:uppercase}
[data-layout=labo] .pop h4{color:#119ea4}
.pop .grid{display:grid;gap:3px}
.pop .it{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s}
.pop .it:hover{background:rgba(128,128,128,.2)}
.pop .it.on{background:var(--acc);color:#111;font-weight:700}
.pop .it small{opacity:.65;font-size:12px;margin-left:6px}
.pop::-webkit-scrollbar{width:8px}.pop::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
#browser{left:40px;top:120px;width:920px;height:800px;display:flex;flex-direction:column;padding:14px}
#browser .bTop{display:flex;gap:10px;align-items:center;margin-bottom:10px}
#browser input{flex:1;height:36px;border-radius:9px;border:0;padding:0 12px;font-size:14px;background:rgba(128,128,128,.15);color:var(--menuInk);outline:none;box-shadow:0 0 0 1px var(--line);-webkit-user-select:text;user-select:text}
#browser .tabs{display:flex;gap:6px}
#browser .tabs button{height:36px;padding:0 12px;border-radius:9px;border:0;cursor:pointer;font-size:13px;font-weight:700;background:rgba(128,128,128,.15);color:var(--menuInk)}
#browser .tabs button.on{background:var(--acc);color:#111}
#browser .bBody{flex:1;display:flex;gap:10px;min-height:0}
#bCats{width:180px;overflow:auto}
#bList{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;align-content:start}
#bList .it{display:flex;align-items:center;gap:8px;padding:6px 8px}
#bList .it .tx{flex:1;min-width:0;display:flex;flex-direction:column}
#bList .it b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
#bList .it small{margin:0;font-size:12px}
#bList .it.missing b{opacity:.6}
#bList .mini{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;background:rgba(128,128,128,.2);color:inherit;font-size:13px;flex:none;display:flex;align-items:center;justify-content:center}
#bList .mini:hover{background:var(--acc);color:#111}
#bList .fav.on{color:#ffbf1f}
#bFoot{margin-top:8px;font-size:12px;opacity:.85;display:flex;justify-content:space-between;align-items:center}
.linkBtn{border:0;background:none;color:var(--acc);cursor:pointer;font-size:12px;text-decoration:underline}
#editor{left:20px;top:110px;width:960px;height:860px;padding:14px 16px;display:flex;flex-direction:column}
#editor .eTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#editor .eTop b{font-size:15px;letter-spacing:2px;text-transform:uppercase}
#eGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 22px;align-content:start}
.eRow{display:grid;grid-template-columns:120px 1fr 64px;align-items:center;gap:6px;height:26px;font-size:12px}
.eRow input[type=range]{width:100%;accent-color:var(--acc)}
.eRow span{text-align:right;font-variant-numeric:tabular-nums}
.eRow select{grid-column:span 2;height:24px;border-radius:6px;background:rgba(128,128,128,.15);color:var(--menuInk);border:0}
.closeX{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;background:rgba(128,128,128,.2);color:var(--menuInk);font-size:18px}
#toast{position:absolute;left:50%;bottom:130px;transform:translate(-50%,10px);background:rgba(10,8,6,.94);color:#f5e6c8;padding:10px 16px;border-radius:10px;font-size:13px;
  box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(0,0,0,.6);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:80;max-width:760px;text-align:center;line-height:1.4}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tip{position:absolute;z-index:90;pointer-events:none;background:#111;color:#f3f3f3;font-size:12px;padding:6px 9px;border-radius:7px;max-width:280px;opacity:0;transition:opacity .15s;line-height:1.35}
#tip.show{opacity:.96}
.gabarit .gz{position:absolute;border:2px dashed #ff2e88;background:rgba(255,46,136,.07);color:#ff2e88;font:700 12px var(--ui);padding:2px 4px;z-index:99;pointer-events:none;overflow:hidden;text-shadow:0 0 3px #fff}
</style>
</head>
<body>
<div id="stage" data-layout="retro">
 <div id="skin">
  <div id="kWrap"><canvas id="kcanvas"></canvas></div>
  <img id="chassis" alt="">
  <img id="cadre" alt="">
  <div id="roll" data-tip="La mélodie en cours — glissez-la vers une piste de votre logiciel"><canvas id="rollCv"></canvas></div>
  <div id="lensInfo"></div><div id="refBadge">RÉFÉRENCE</div>
  <div id="gLogo" class="grp"><div><b>KALEIDOSCOPE</b><small>BY ROOM LABS AUDIO</small></div></div>
  <div id="gPreset" class="grp"></div>
  <div id="gMaster" class="grp"></div>
  <div id="gStyle" class="grp light"></div>
  <div id="gMode" class="grp light"></div>
  <div id="gKey" class="grp light"></div>
  <div id="gTon" class="grp light"></div>
  <div id="gGen" class="grp light"></div>
  <div id="gPerso" class="grp light"></div>
  <div id="gEngA" class="grp dark"></div>
  <div id="gEngB" class="grp dark"></div>
  <div id="gMisc" class="grp dark"></div>
  <div id="gFoot" class="grp dark"></div>
 </div>
 <input id="dropFile" type="file" accept="audio/*" style="display:none">
 <div id="veil"></div>
 <div id="menu" class="pop"></div>
 <div id="browser" class="pop">
   <div class="bTop"><div class="tabs"><button data-tab="all" class="on">Tout</button><button data-tab="nat">Synthèse</button><button data-tab="fond">Instruments</button><button data-tab="fav">&#9733; Favoris</button></div>
     <input id="bSearch" placeholder="Rechercher un son, une catégorie, un style…"><button class="closeX" data-close>&times;</button></div>
   <div class="bBody"><div id="bCats"></div><div id="bList"></div></div>
   <div id="bFoot"><span id="bCount"></span><span><button class="linkBtn" id="bOpenBanks">Dossier des instruments</button></span></div>
 </div>
 <div id="editor" class="pop"><div class="eTop"><b>Édition du son</b><button class="closeX" data-close>&times;</button></div><div id="eGrid"></div></div>
 <div id="toast"></div><div id="tip"></div>
</div>
<script src="kscope.js"></script>
<script src="drop.js"></script>
<script src="app.js"></script>
</body>
</html>
