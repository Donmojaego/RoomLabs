<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaleidoscope · Room Labs Audio</title>
<style>
/* =============================================================================
   4 layouts, un seul DOM : chaque layout = un jeu de variables + quelques règles.
   Les images d'un layout (ui/assets/<layout>_<clé>.webp) remplacent le dessin CSS dès qu'elles existent.
   ============================================================================= */
:root{--ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
[data-layout=retro]{--bg:#2b160b;--bg2:#5a2e14;--wood1:#7a3f1a;--wood2:#3d1d0b;--panel:#efe0c2;--panel2:#e2cfa9;--pline:#b98b4f;--ink:#3a2411;--ink2:#6d4a28;
  --acc:#ef7a1a;--acc2:#ffb347;--accInk:#fff6e6;--lens:#120a05;--glow:rgba(255,160,60,.55);--knob1:#fff2c9;--knob2:#c9a14a;--knob3:#7a5518;--track:#b08a55;
  --btn:#f4e6c8;--btnInk:#5a3a1a;--hdrInk:#fbe8c6;--title:"Georgia","Times New Roman",serif;--strip:#d9c29a;--dark:#2a170a;--darkInk:#f6dcae}
[data-layout=telescope]{--bg:#0d0a18;--bg2:#1b1430;--wood1:#3b2a12;--wood2:#1a1208;--panel:#15111f;--panel2:#1d1729;--pline:#b8862f;--ink:#f3dfb1;--ink2:#bba57a;
  --acc:#b043ff;--acc2:#ff9a3d;--accInk:#fff;--lens:#05030a;--glow:rgba(190,90,255,.55);--knob1:#fff1c8;--knob2:#c2923a;--knob3:#5a3a10;--track:#4b3a62;
  --btn:#221a30;--btnInk:#f3dfb1;--hdrInk:#f6dfa8;--title:"Georgia","Times New Roman",serif;--strip:#2a2038;--dark:#0e0a16;--darkInk:#f3dfb1}
[data-layout=holo]{--bg:#060816;--bg2:#0d1230;--wood1:#14193a;--wood2:#070a1c;--panel:rgba(12,18,44,.92);--panel2:rgba(18,26,60,.9);--pline:#36d8ff;--ink:#dff6ff;--ink2:#8fb2d9;
  --acc:#22d3ff;--acc2:#b26bff;--accInk:#031018;--lens:#02030a;--glow:rgba(40,210,255,.55);--knob1:#2a3566;--knob2:#141b3d;--knob3:#070b1e;--track:#24305e;
  --btn:rgba(16,24,58,.95);--btnInk:#cfeaff;--hdrInk:#e6f8ff;--title:var(--ui);--strip:#101736;--dark:#050817;--darkInk:#cfeaff}
[data-layout=laiton]{--bg:#120c06;--bg2:#2b1d0d;--wood1:#6b4a1c;--wood2:#2a1a08;--panel:#1c140c;--panel2:#271b0f;--pline:#d4a64a;--ink:#f7e2ae;--ink2:#c9ad75;
  --acc:#e0b24a;--acc2:#fff0b8;--accInk:#2a1a06;--lens:#070502;--glow:rgba(255,206,110,.5);--knob1:#fff3cf;--knob2:#d0a347;--knob3:#6a4710;--track:#4a3618;
  --btn:#2b1f12;--btnInk:#f7e2ae;--hdrInk:#ffe9b5;--title:"Georgia","Times New Roman",serif;--strip:#21170c;--dark:#120c06;--darkInk:#f7e2ae}

*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:var(--ui);color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1100px;height:700px;transform-origin:0 0;overflow:hidden;background:var(--bg);transition:background .4s}
#stage.switching #skin{opacity:0}
#skin{position:absolute;inset:0;transition:opacity .28s ease}
.abs{position:absolute}
button{font-family:var(--ui)}

/* ---- fond de chaque layout (remplacé par <layout>_fond.webp) */
#bgArt{position:absolute;inset:0;pointer-events:none}
[data-layout=retro] #bgArt{background:
  linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.25)),
  repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 3px,rgba(255,255,255,.02) 3px 9px,rgba(0,0,0,.05) 9px 14px),
  linear-gradient(180deg,var(--wood1),var(--wood2))}
[data-layout=retro] #bgArt::after{content:"";position:absolute;left:0;right:0;top:0;height:64px;background:
  linear-gradient(100deg,transparent 52%,#f0a43a 52% 55%,#e2702a 55% 58%,#b8441c 58% 61%,transparent 61%),linear-gradient(180deg,#4a250f,#2e1608);opacity:.95}
[data-layout=telescope] #bgArt{background:radial-gradient(ellipse at 42% 46%,#3a1c5c 0%,#160d27 45%,#07050d 100%)}
[data-layout=telescope] #bgArt::after{content:"";position:absolute;left:236px;top:58px;width:520px;height:350px;border-radius:50%;
  background:conic-gradient(from 0deg,#ff5f9e,#ffb03a,#53e0ff,#a05cff,#ff5f9e);filter:blur(60px);opacity:.25}
[data-layout=holo] #bgArt{background:
  linear-gradient(rgba(60,200,255,.06) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(60,200,255,.06) 1px,transparent 1px) 0 0/22px 22px,
  radial-gradient(ellipse at 50% 35%,#1a1f56 0%,#080b1f 60%,#03040c 100%)}
[data-layout=laiton] #bgArt{background:radial-gradient(ellipse at 50% 40%,#3a2810,#140d05 75%)}
[data-layout=laiton] #bgArt::after{content:"";position:absolute;inset:6px;border-radius:18px;border:3px solid #c99a3e;
  box-shadow:inset 0 0 0 2px #5b3d10,inset 0 0 40px rgba(0,0,0,.7),0 0 0 2px #2a1a08}
#bgImg{position:absolute;inset:0;width:1100px;height:700px;display:none;pointer-events:none}
.hasFond #bgImg{display:block}.hasFond #bgArt{display:none}

/* ---- en-tête */
#logo{left:22px;top:8px;width:340px;height:50px;color:var(--hdrInk);line-height:1}
#logo b{display:block;font-family:var(--title);font-size:31px;letter-spacing:4px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.45)}
#logo small{display:block;font-size:12px;letter-spacing:3.5px;margin-top:4px;opacity:.85;padding-left:2px}
[data-layout=holo] #logo b{font-weight:300;letter-spacing:9px;font-size:27px;text-shadow:0 0 12px rgba(60,210,255,.8)}
[data-layout=telescope] #logo b,[data-layout=laiton] #logo b{background:linear-gradient(180deg,#fff3c4,#d8a744 60%,#a8741c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.7))}
#logoImg{left:22px;top:8px;width:340px;height:67px;display:none;object-fit:contain;object-position:left center}
.hasLogo #logoImg{display:block}.hasLogo #logo{display:none}

#presetBox{left:392px;top:12px;width:400px;height:42px;display:flex;align-items:stretch;border-radius:10px;overflow:hidden;
  background:var(--dark);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 0 1px var(--pline)}
#presetBox button{width:38px;border:0;background:transparent;color:var(--darkInk);font-size:16px;cursor:pointer;transition:background .15s}
#presetBox button:hover{background:rgba(255,255,255,.08)}
#pname{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;min-width:0;color:var(--darkInk);padding:0 6px}
#pname small{font-size:12px;letter-spacing:1.5px;opacity:.7;text-transform:uppercase;white-space:nowrap}
#pname b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#pname:hover b{color:var(--acc2)}
#layoutBtn{left:808px;top:12px;width:170px;height:42px;white-space:nowrap;letter-spacing:.6px}
#gearBtn{left:1046px;top:12px;width:42px;height:42px;font-size:20px}
#helpBtn{left:992px;top:12px;width:42px;height:42px;font-size:17px;font-weight:700}

/* ---- boutons communs */
.btn{position:absolute;border:0;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--btnInk);
  background:var(--btn);box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px var(--pline);
  transition:transform .08s,box-shadow .15s,background .15s,color .15s;display:flex;align-items:center;justify-content:center;gap:7px;text-transform:uppercase}
.btn:hover{box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px var(--acc),0 0 14px var(--glow)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.on{background:var(--acc);color:var(--accInk)}
.btn svg{width:16px;height:16px;flex:none}
[data-layout=holo] .btn{background:linear-gradient(180deg,rgba(30,44,96,.95),rgba(12,18,46,.95));box-shadow:0 0 0 1px rgba(60,210,255,.45),inset 0 0 12px rgba(60,210,255,.12)}
[data-layout=holo] .btn.on{background:linear-gradient(180deg,#49e2ff,#1597c8);box-shadow:0 0 0 1px #8af0ff,0 0 16px rgba(60,210,255,.6)}

/* bascule à deux positions (Solo/Accomp, Keys/Drop) */
.seg{position:absolute;display:flex;border-radius:11px;padding:3px;background:var(--panel2);box-shadow:inset 0 2px 4px rgba(0,0,0,.3),0 0 0 1px var(--pline)}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--ink2);
  text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,color .2s,box-shadow .2s}
.seg button i{width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.25);box-shadow:inset 0 1px 2px rgba(0,0,0,.5);transition:background .2s,box-shadow .2s}
.seg button.on{background:var(--acc);color:var(--accInk);box-shadow:0 1px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.seg button.on i{background:#fff6cc;box-shadow:0 0 8px #ffd36b,0 0 2px #fff}
[data-layout=holo] .seg button.on i{background:#e8fdff;box-shadow:0 0 8px #5fe6ff}
.useImg .seg button{background:var(--imgOff) center/100% 100% no-repeat}.useImg .seg button.on{background:var(--imgOn) center/100% 100% no-repeat}

/* ---- colonne gauche */
#left{left:18px;top:72px;width:236px;height:322px;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--pline),0 6px 18px rgba(0,0,0,.4)}
[data-layout=retro] #left,[data-layout=retro] #right{box-shadow:0 0 0 2px #c79a5b,inset 0 0 0 4px #f6ead2,0 6px 18px rgba(0,0,0,.45)}
.lbl{position:absolute;font-size:12px;font-weight:700;letter-spacing:1.6px;color:var(--ink2);text-transform:uppercase}
.pick{position:absolute;height:34px;border-radius:9px;display:flex;align-items:center;padding:0 30px 0 12px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);
  background:var(--panel2);box-shadow:inset 0 1px 3px rgba(0,0,0,.25),0 0 0 1px var(--pline);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:box-shadow .15s}
.pick::after{content:"";position:absolute;right:12px;top:13px;width:7px;height:7px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg)}
.pick:hover{box-shadow:inset 0 1px 3px rgba(0,0,0,.25),0 0 0 1px var(--acc),0 0 10px var(--glow)}
[data-layout=retro] .pick{background:#fff8ea}[data-layout=retro] .panel .pick{background:var(--panel2)}
#dropZone{left:12px;top:228px;width:212px;height:82px;border-radius:10px;border:2px dashed var(--pline);display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;font-size:12px;color:var(--ink2);cursor:pointer;transition:background .2s,border-color .2s;padding:4px 8px;line-height:1.35}
#dropZone b{font-size:13px;color:var(--ink);letter-spacing:.5px}
#dropZone.over{background:rgba(255,180,80,.18);border-color:var(--acc)}
.dropMode #dropZone{display:flex}.dropMode #keysRow{display:none}

/* ---- lentille centrale */
#lensWrap{left:266px;top:70px;width:468px;height:326px}
#lens{position:absolute;overflow:hidden;background:var(--lens)}
#kcanvas{position:absolute;inset:0;width:100%;height:100%}
[data-layout=retro] #lensWrap{border-radius:26px;background:linear-gradient(180deg,#5b3518,#2a1508);box-shadow:0 0 0 2px #c79a5b,0 8px 22px rgba(0,0,0,.55)}
[data-layout=retro] #lens{left:14px;top:12px;right:14px;bottom:12px;border-radius:38px/30px;box-shadow:inset 0 0 30px rgba(0,0,0,.9),0 0 0 3px #1a0d05,0 0 0 5px #8a5a26}
[data-layout=retro] #lens::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(ellipse at 30% 18%,rgba(255,255,255,.16),transparent 40%),radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(0,0,0,.55));}
[data-layout=telescope] #lens,[data-layout=holo] #lens,[data-layout=laiton] #lens{left:76px;top:-2px;width:318px;height:318px;border-radius:50%}
[data-layout=telescope] #lensWrap::before{content:"";position:absolute;left:54px;top:-24px;width:362px;height:362px;border-radius:50%;
  background:conic-gradient(#e74fa0,#ffb23d,#ffe66b,#45d8ff,#8a5cff,#e74fa0);box-shadow:0 0 0 6px #c4903a,0 0 0 9px #4a3010,0 0 40px rgba(180,90,255,.6);
  -webkit-mask:radial-gradient(circle,transparent 160px,#000 161px);mask:radial-gradient(circle,transparent 160px,#000 161px)}
[data-layout=telescope] #lens{box-shadow:0 0 0 4px #e2b45a,0 0 0 7px #5a3c10,inset 0 0 40px rgba(0,0,0,.85)}
[data-layout=holo] #lens{box-shadow:0 0 0 2px #46e1ff,0 0 26px rgba(60,210,255,.7),0 0 0 10px rgba(80,60,200,.25),inset 0 0 30px rgba(0,0,0,.9)}
[data-layout=holo] #lensWrap::before{content:"";position:absolute;left:40px;top:-38px;width:390px;height:390px;border-radius:50%;
  background:repeating-conic-gradient(rgba(70,225,255,.55) 0 2deg,transparent 2deg 15deg);-webkit-mask:radial-gradient(circle,transparent 176px,#000 177px,#000 194px,transparent 195px);
  mask:radial-gradient(circle,transparent 176px,#000 177px,#000 194px,transparent 195px);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
[data-layout=laiton] #lens{box-shadow:0 0 0 5px #e2b45a,0 0 0 9px #7a5616,0 0 0 12px #2a1a08,inset 0 0 40px rgba(0,0,0,.85)}
[data-layout=laiton] #lensWrap::after{content:"";position:absolute;left:62px;top:-16px;width:346px;height:346px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 2.5%,#f5d27a 0 6px,transparent 7px),radial-gradient(circle at 50% 97.5%,#f5d27a 0 6px,transparent 7px),
  radial-gradient(circle at 2.5% 50%,#f5d27a 0 6px,transparent 7px),radial-gradient(circle at 97.5% 50%,#f5d27a 0 6px,transparent 7px)}
#lensImg{position:absolute;left:-266px;top:-70px;width:1100px;height:700px;pointer-events:none;display:none}
.hasLentille #lensImg{display:block}
/* mini-rouleau : la mélodie en cours, tête de lecture */
#roll{position:absolute;left:0;right:0;bottom:0;height:60px;pointer-events:auto;cursor:grab}
[data-layout=telescope] #roll,[data-layout=holo] #roll,[data-layout=laiton] #roll{left:30px;right:30px;bottom:-2px;height:54px}
#rollCv{position:absolute;inset:0;width:100%;height:100%}
#lensInfo{position:absolute;left:18px;top:14px;font-size:12px;letter-spacing:1px;color:#fff;text-shadow:0 1px 3px #000;opacity:.85;pointer-events:none}
[data-layout=telescope] #lensInfo,[data-layout=holo] #lensInfo,[data-layout=laiton] #lensInfo{left:76px;width:318px;top:26px;text-align:center}

/* ---- colonne droite */
#right{left:746px;top:72px;width:336px;height:322px;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--pline),0 6px 18px rgba(0,0,0,.4)}
#genBtn{left:14px;top:12px;width:308px;height:58px;border-radius:16px;font-size:21px;letter-spacing:3px;color:#fff;
  background:linear-gradient(180deg,var(--acc2),var(--acc) 55%,color-mix(in srgb,var(--acc) 70%,#000));
  box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 2px color-mix(in srgb,var(--acc) 60%,#000),0 0 22px var(--glow);text-shadow:0 1px 2px rgba(0,0,0,.45)}
#genBtn:hover{filter:brightness(1.08)}
#genBtn.flash{animation:genFlash .5s ease-out}
@keyframes genFlash{0%{box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 2px var(--acc),0 0 50px var(--acc2)}}
[data-layout=holo] #genBtn{background:linear-gradient(180deg,rgba(40,70,140,.9),rgba(10,20,60,.95));color:#bff4ff;box-shadow:0 0 0 2px #46e1ff,0 0 24px rgba(60,210,255,.6),inset 0 0 18px rgba(60,210,255,.35);text-shadow:0 0 10px #46e1ff}
[data-layout=telescope] #genBtn{background:linear-gradient(180deg,#d38bff,#8a2be2 55%,#4b1281);box-shadow:0 0 0 2px #e0b0ff,0 0 28px rgba(190,90,255,.75),inset 0 2px 0 rgba(255,255,255,.4)}
.useGen #genBtn{background:var(--genOff) center/100% 100% no-repeat;box-shadow:none}.useGen #genBtn:active,.useGen #genBtn.flash{background-image:var(--genOn)}
#row2 .btn{position:static;height:38px;flex:1}
#row2{left:14px;top:80px;width:308px;display:flex;gap:8px}
#playBtn{flex:0 0 74px!important}
#playBtn.on{background:#3ec46d;color:#fff}
[data-layout=holo] #playBtn.on{background:linear-gradient(180deg,#5affb0,#14a764)}
.knobs{position:absolute;display:flex;justify-content:space-around}
#knobsR{left:8px;top:126px;width:320px;height:104px}
#persoRow{left:14px;top:236px;width:308px;display:flex;gap:6px}
#persoRow .btn{position:static;height:34px;flex:1 1 auto;font-size:12px;letter-spacing:.3px;padding:0 6px;text-transform:none;white-space:nowrap;gap:5px}
#persoRow .btn svg{width:14px;height:14px}
#row4{left:14px;top:278px;width:308px;display:flex;gap:6px}
#row4 .btn{position:static;height:32px;flex:1;font-size:12px;text-transform:none;letter-spacing:.5px}
#row4 .pick{position:relative;height:32px;flex:1.25;font-size:13px}

/* ---- molettes */
.knob{position:relative;display:flex;flex-direction:column;align-items:center;cursor:ns-resize;touch-action:none;width:74px}
.knob svg{display:block;overflow:visible}
.knob .k-lbl{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--ink2);text-transform:uppercase;margin-top:3px;white-space:nowrap}
.knob .k-val{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;height:15px;opacity:0;transition:opacity .2s;white-space:nowrap}
.knob:hover .k-val,.knob.drag .k-val{opacity:1}
.knob .cap{transition:filter .15s}.knob:hover .cap{filter:brightness(1.1)}
.knob img.capImg{position:absolute;pointer-events:none;will-change:transform}
.panel .knob .k-lbl{color:var(--ink2)}

/* ---- panneaux du bas */
.panel{position:absolute;top:404px;height:182px;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--pline),0 6px 18px rgba(0,0,0,.4)}
[data-layout=retro] .panel{background:linear-gradient(180deg,#3b1f0d,#25130a);box-shadow:0 0 0 2px #c79a5b,inset 0 0 0 4px #4d2b12,0 6px 18px rgba(0,0,0,.5);--ink:#f7dfb2;--ink2:#d9b47a;--panel2:#1d0f06}
#pWave{left:18px;width:420px}#pGrain{left:448px;width:330px}#pFond{left:788px;width:294px}
.ph{position:absolute;left:12px;right:12px;top:8px;height:28px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:1.6px;color:var(--ink);text-transform:uppercase}
.pow{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;background:var(--panel2);box-shadow:0 0 0 1px var(--pline);display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:all .2s;flex:none}
.pow svg{width:14px;height:14px}
.pow.on{background:var(--acc);color:var(--accInk);box-shadow:0 0 0 1px var(--acc),0 0 10px var(--glow)}
.ph .pick{position:relative;height:28px;font-size:13px;margin-left:auto;max-width:150px;text-transform:none;letter-spacing:0}
.scope{position:absolute;left:12px;right:12px;top:42px;height:46px;border-radius:8px;background:var(--dark);box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
.scope canvas{width:100%;height:100%;display:block}
.panel .knobs{left:4px;right:4px;top:94px;height:84px}
.panel.off .knobs,.panel.off .scope{opacity:.45;filter:saturate(.4);transition:opacity .25s}
#bankState{position:absolute;left:12px;right:12px;top:42px;height:46px;border-radius:8px;background:var(--dark);box-shadow:inset 0 2px 6px rgba(0,0,0,.7);
  color:var(--darkInk);font-size:12px;display:flex;flex-direction:column;justify-content:center;padding:0 10px;line-height:1.4;cursor:pointer}
#bankState b,#bankState span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#bankState b{font-size:13px}

/* ---- clavier */
#kbWrap{left:18px;top:596px;width:1064px;height:96px;border-radius:12px;padding:6px 8px 8px;background:linear-gradient(180deg,#2a170a,#120904);box-shadow:0 0 0 1px var(--pline),0 6px 16px rgba(0,0,0,.5)}
[data-layout=holo] #kbWrap{background:linear-gradient(180deg,#0c1236,#050819)}
[data-layout=telescope] #kbWrap{background:linear-gradient(180deg,#1c1428,#0b0812)}
#kb{position:relative;width:100%;height:100%}
.wk,.bk{position:absolute;top:0;cursor:pointer;transition:background .08s,transform .08s}
.wk{height:100%;border-radius:0 0 6px 6px;background:linear-gradient(180deg,#f9f3e3,#e8dcc0);box-shadow:inset 0 -6px 0 #d4c39d,inset 0 0 0 1px rgba(0,0,0,.25)}
.bk{height:58%;border-radius:0 0 4px 4px;background:linear-gradient(180deg,#2c2620,#0a0806);box-shadow:inset 0 -4px 0 #000,0 2px 3px rgba(0,0,0,.6);z-index:2}
.wk.on{background:linear-gradient(180deg,var(--acc2),var(--acc));transform:translateY(1px)}
.bk.on{background:linear-gradient(180deg,var(--acc),#5a2a00)}
.wk.inScale::after{content:"";position:absolute;left:50%;bottom:9px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--acc);opacity:.7}
.wk span{position:absolute;bottom:13px;left:0;right:0;text-align:center;font-size:12px;color:#7a6440}
#kbImg{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}.hasClavier #kbImg{display:block}

/* ---- menus déroulants et fenêtres */
#veil{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#veil.show{opacity:1;pointer-events:auto}
.pop{position:absolute;z-index:60;border-radius:12px;background:var(--dark);color:var(--darkInk);box-shadow:0 0 0 1px var(--pline),0 14px 40px rgba(0,0,0,.7);
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .16s ease,transform .16s ease;padding:8px;max-height:560px;overflow:auto}
.pop.show{opacity:1;transform:none;pointer-events:auto}
.pop h4{margin:6px 8px 4px;font-size:12px;letter-spacing:1.6px;color:var(--acc);text-transform:uppercase}
.pop .grid{display:grid;gap:3px}
.pop .it{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s}
.pop .it:hover{background:rgba(255,255,255,.09)}
.pop .it.on{background:var(--acc);color:var(--accInk);font-weight:700}
.pop .it small{opacity:.65;font-size:12px;margin-left:6px}
.pop::-webkit-scrollbar{width:8px}.pop::-webkit-scrollbar-thumb{background:var(--pline);border-radius:4px}

#browser{left:60px;top:66px;width:980px;height:560px;display:flex;flex-direction:column;padding:14px}
#browser .bTop{display:flex;gap:10px;align-items:center;margin-bottom:10px}
#browser input{flex:1;height:36px;border-radius:9px;border:0;padding:0 12px;font-size:14px;background:rgba(255,255,255,.08);color:var(--darkInk);outline:none;box-shadow:0 0 0 1px var(--pline);-webkit-user-select:text;user-select:text}
#browser .tabs{display:flex;gap:6px}
#browser .tabs button{height:36px;padding:0 14px;border-radius:9px;border:0;cursor:pointer;font-size:13px;font-weight:700;background:rgba(255,255,255,.07);color:var(--darkInk);transition:background .15s}
#browser .tabs button.on{background:var(--acc);color:var(--accInk)}
#browser .bBody{flex:1;display:flex;gap:10px;min-height:0}
#bCats{width:190px;overflow:auto}
#bList{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-content:start}
#bList .it{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 10px}
#bList .it b{font-size:14px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis}
#bList .it small{margin:0;font-size:12px}
#bList .it.missing b{opacity:.6}
#bFoot{margin-top:8px;font-size:12px;opacity:.8;display:flex;justify-content:space-between;align-items:center}
#bFoot button,.linkBtn{border:0;background:none;color:var(--acc2);cursor:pointer;font-size:12px;text-decoration:underline}

#editor{left:40px;top:66px;width:1020px;height:600px;padding:14px 16px;display:flex;flex-direction:column}
#editor .eTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#editor .eTop b{font-size:15px;letter-spacing:2px;text-transform:uppercase}
#eGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;align-content:start}
.eGrp h4{margin:4px 0 4px}
.eRow{display:grid;grid-template-columns:110px 1fr 58px;align-items:center;gap:6px;height:26px;font-size:12px}
.eRow input[type=range]{width:100%;accent-color:var(--acc)}
.eRow span{text-align:right;font-variant-numeric:tabular-nums}
.closeX{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.08);color:var(--darkInk);font-size:18px}

#toast{position:absolute;left:50%;bottom:118px;transform:translate(-50%,10px);background:var(--dark);color:var(--darkInk);padding:9px 16px;border-radius:10px;font-size:13px;
  box-shadow:0 0 0 1px var(--pline),0 8px 24px rgba(0,0,0,.6);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:80;max-width:640px;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tip{position:absolute;z-index:90;pointer-events:none;background:#111;color:#f3f3f3;font-size:12px;padding:6px 9px;border-radius:7px;max-width:260px;opacity:0;transition:opacity .15s;line-height:1.35}
#tip.show{opacity:.96}

/* mode gabarit (fichiers docs/gabarits) : zones des assets */
.gabarit #skin *{animation:none!important}
.gabarit .gz{position:absolute;border:2px dashed #ff2e88;background:rgba(255,46,136,.08);color:#ff2e88;font:700 12px var(--ui);padding:3px 5px;z-index:99;pointer-events:none}
</style>
</head>
<body>
<div id="stage" data-layout="retro">
 <div id="skin">
  <div id="bgArt"></div><img id="bgImg" alt="">

  <div id="logo" class="abs"><b>KALEIDOSCOPE</b><small>BY ROOM LABS AUDIO</small></div><img id="logoImg" class="abs" alt="">
  <div id="presetBox" class="abs">
    <button id="prevP" data-tip="Preset précédent">&#9664;</button>
    <div id="pname" data-tip="Ouvrir le navigateur : 150 presets + 100 fonds"><small id="pcat">Preset</small><b id="pnm">—</b></div>
    <button id="nextP" data-tip="Preset suivant">&#9654;</button>
    <button id="browseP" data-tip="Parcourir"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"/></svg></button>
  </div>
  <button id="layoutBtn" class="btn" data-tip="Clic : layout suivant · clic droit ou appui long : liste des layouts. Rien d'autre ne change.">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><circle cx="17" cy="17" r="4"/></svg>
    <span id="layoutName">Rétro</span></button>
  <button id="helpBtn" class="btn" data-tip="Aide rapide">?</button>
  <button id="gearBtn" class="btn" data-tip="Réglages : taille, animation, dossiers">&#9881;</button>

  <!-- colonne gauche : style, humeur, rôle, tonalité -->
  <div id="left" class="abs">
    <div class="lbl" style="left:14px;top:10px">Style</div>
    <div id="stylePick" class="pick" style="left:12px;top:28px;width:212px" data-tip="59 styles en 9 familles"></div>
    <div class="lbl" style="left:14px;top:70px">Humeur</div>
    <div id="moodPick" class="pick" style="left:12px;top:88px;width:212px"></div>
    <div id="segRole" class="seg" style="left:12px;top:132px;width:212px;height:40px" data-param="genMode">
      <button data-v="0" data-tip="Solo : une mélodie, une note à la fois"><i></i>Solo</button><button data-v="1" data-tip="Accompagnement : accords, arpèges, rythmiques"><i></i>Accomp</button></div>
    <div id="segKey" class="seg" style="left:12px;top:180px;width:212px;height:40px" data-param="keyMode">
      <button data-v="0" data-tip="Keys : vous choisissez la tonique et la gamme"><i></i>Keys</button><button data-v="1" data-tip="Drop : déposez un son, la mélodie se construit autour"><i></i>Drop</button></div>
    <div id="keysRow">
      <div class="lbl" style="left:14px;top:228px">Tonique</div><div class="lbl" style="left:98px;top:228px">Gamme</div>
      <div id="rootPick" class="pick" style="left:12px;top:246px;width:78px"></div>
      <div id="scalePick" class="pick" style="left:96px;top:246px;width:128px"></div>
    </div>
    <div id="dropZone"><b>Déposez un son ici</b><span id="dropTxt">ou cliquez pour choisir un fichier (wav, mp3, flac…)</span></div>
    <input id="dropFile" type="file" accept="audio/*" style="display:none">
    <div class="lbl" style="left:14px;top:290px;display:none"></div>
    <div id="barsPick" class="pick" style="left:12px;top:284px;width:104px;height:30px;font-size:13px" data-tip="Longueur de la boucle"></div>
    <div id="octPick" class="pick" style="left:122px;top:284px;width:102px;height:30px;font-size:13px" data-tip="Octave de la mélodie"></div>
  </div>

  <!-- lentille : le kaléidoscope -->
  <div id="lensWrap" class="abs">
    <div id="lens"><canvas id="kcanvas"></canvas></div>
    <img id="lensImg" alt="">
    <div id="roll" data-tip="La mélodie en cours — glissez-la vers une piste de votre logiciel"><canvas id="rollCv"></canvas></div>
    <div id="lensInfo"></div>
  </div>

  <!-- colonne droite : générer, déclinaison, personal -->
  <div id="right" class="abs">
    <button id="genBtn" class="btn abs" data-tip="Nouvelle mélodie dans le style choisi (raccourci : Espace)">GÉNÉRER</button>
    <div id="row2" class="abs">
      <button id="declBtn" class="btn" data-tip="Variation de la mélodie actuelle, même ADN">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M20 4v5h-5M4 20v-5h5"/></svg>Déclinaison</button>
      <button id="prevBtn" class="btn" data-tip="Revenir à la proposition précédente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Retour</button>
      <button id="playBtn" class="btn" data-tip="Lecture / arrêt (suit le transport de votre logiciel quand il joue)">
        <svg id="playIco" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>
    </div>
    <div id="knobsR" class="knobs"></div>
    <div id="persoRow" class="abs">
      <button class="btn" data-fb="like" data-tip="J'aime : Personal apprend vos goûts"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></svg>J'aime</button>
      <button class="btn" data-fb="keep" data-tip="Garder : compte double dans Personal"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3 7h7l-5.5 4.5L18.5 21 12 16.8 5.5 21l2-7.5L2 9h7z"/></svg>Garder</button>
      <button class="btn" data-fb="redo" data-tip="À refaire : Personal évite ce genre de mélodie, et en propose une autre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>À refaire</button>
      <button class="btn" id="resetPerso" style="flex:0 0 40px" data-tip="Remettre Personal à zéro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
    <div id="row4" class="abs">
      <div id="evolvePick" class="pick" data-tip="Infini : la mélodie évolue toute seule pendant la lecture"></div>
      <button id="midiBtn" class="btn" data-tip="Exporter la mélodie en .mid (Documents/Room Labs/Kaleidoscope/MIDI)">Export MIDI</button>
    </div>
  </div>

  <!-- panneaux du moteur -->
  <div id="pWave" class="panel"><div class="ph"><button class="pow" data-param="wtOn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v8M6.3 7.3a8 8 0 1 0 11.4 0"/></svg></button>Wavetable / Soustractif
      <div id="tablePick" class="pick"></div></div>
    <div class="scope"><canvas id="waveCv"></canvas></div><div class="knobs" id="knobsW"></div></div>
  <div id="pGrain" class="panel"><div class="ph"><button class="pow" data-param="granOn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v8M6.3 7.3a8 8 0 1 0 11.4 0"/></svg></button>Granulaire / Texture</div>
    <div class="scope"><canvas id="grainCv"></canvas></div><div class="knobs" id="knobsG"></div></div>
  <div id="pFond" class="panel"><div class="ph"><button class="pow" data-param="smpOn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v8M6.3 7.3a8 8 0 1 0 11.4 0"/></svg></button>Fond &amp; Espace
      <button class="linkBtn" id="editBtn" style="margin-left:auto;font-size:12px;letter-spacing:.5px;text-transform:none">Tout éditer</button></div>
    <div id="bankState"><b id="bankName">Aucun fond chargé</b><span id="bankSub">Choisissez un fond dans le navigateur</span></div><div class="knobs" id="knobsF"></div></div>

  <div id="kbWrap" class="abs"><img id="kbImg" alt=""><div id="kb"></div></div>
 </div>

 <div id="veil"></div>
 <div id="menu" class="pop"></div>
 <div id="browser" class="pop">
   <div class="bTop"><div class="tabs"><button data-tab="all" class="on">Tout</button><button data-tab="nat">Natifs</button><button data-tab="fond">Fonds</button></div>
     <input id="bSearch" placeholder="Rechercher un son, une catégorie, un style…"><button class="closeX" data-close>&times;</button></div>
   <div class="bBody"><div id="bCats"></div><div id="bList"></div></div>
   <div id="bFoot"><span id="bCount"></span><span><button id="bOpenBanks">Dossier des fonds</button></span></div>
 </div>
 <div id="editor" class="pop"><div class="eTop"><b>Édition du son</b><button class="closeX" data-close>&times;</button></div><div id="eGrid"></div></div>
 <div id="toast"></div><div id="tip"></div>
</div>
<script src="kscope.js"></script>
<script src="drop.js"></script>
<script src="app.js"></script>
</body>
</html>
