<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Reverb — Room Labs Audio</title><link rel="stylesheet" href="rl.css"></head>
<body>
<script src="rl_license_ui.js"></script>
<script src="rl.js"></script>
<script>
"use strict";
const pct = v => Math.round(v * 100) + " %";
const hz = v => v >= 1000 ? (v / 1000).toFixed(1) + " kHz" : Math.round(v) + " Hz";
const layout = {
  product: "vst/reverb", title: "REVERB",
  header: { x: 40, y: 24, bx: 520 },
  help: "Réverbération algorithmique. ROOM : petite pièce dense, HALL : grande salle, PLATE : plaque brillante. Le changement de type se fait en fondu, sans clic. BYPASS coupe l'entrée de la réverbération mais laisse la queue s'éteindre naturellement. TAILLE règle la dimension, DÉCLIN la durée (RT60), PRÉ-DÉLAI l'écart avant la queue, AMORTI coupe les aigus de la queue, COUPE-BAS allège le grave de l'effet.",
  formats: { size: pct, decay: v => v.toFixed(v < 10 ? 2 : 1) + " s", predelay: v => Math.round(v) + " ms", damp: hz, lowcut: hz, mix: pct, width: pct },
  build(RL) {
    ["ROOM", "HALL", "PLATE"].forEach((t, i) => RL.key({ id: "type", label: t, x: 54 + i * 104, y: 78, w: 96, h: 40, value: i, tip: "Type de réverbération : " + t.toLowerCase() }));
    RL.key({ id: "freeze", label: "BYPASS", x: 566, y: 78, w: 120, h: 40, tip: "Coupe l'entrée de la réverbe, la queue continue" });
    RL.screen({ frame: 0, draw: screen });
    const k = [["size", "TAILLE", "Dimension de l'espace"], ["decay", "DÉCLIN", "Durée de la queue (RT60)"], ["predelay", "PRÉ-DÉLAI", "Écart avant la queue"],
      ["damp", "AMORTI", "Coupe des aigus dans la queue"], ["lowcut", "COUPE-BAS", "Allège le grave de l'effet"], ["width", "LARGEUR", "Mono à stéréo large"], ["mix", "MIX", "Dosage sec / effet"]];
    k.forEach(([id, label, tip], i) => RL.knob({ id, label, tip, x: 85 + i * 95, y: 540, d: 66, size: 2 }));
  },
  async mockState() { const r = { type: [0,2,1,1,["Room","Hall","Plate"]], size: [0,1,.6,1], decay: [.1,30,2.4,1], predelay: [0,250,20,1], damp: [1000,20000,7000,1], lowcut: [20,600,120,1], mix: [0,1,.3,1], width: [0,1,1,1], freeze: [0,1,0,1] };
    const params = {}; for (const k in r) params[k] = r[k][2]; return { params, ranges: r }; },
  mock: () => Promise.resolve(null),
  mockFb() { const env = []; for (let i = 0; i < 48; i++) env.push(.3 * Math.exp(-i / 14) * (0.8 + Math.random() * .4)); return { in: -14, wet: -20, env }; }
};
function screen(c, w, h, f) {
  c.fillStyle = RL.css("--scr"); c.fillRect(0, 0, w, h);
  const ink = RL.css("--scrInk");
  // courbe de déclin théorique (RT60) + enveloppe mesurée
  const dec = RL.P("decay"), pre = RL.P("predelay") / 1000, span = Math.max(1, dec * 1.2 + pre);
  const x0 = 20, y0 = h - 30, gw = w - 40, gh = h - 70;
  c.strokeStyle = ink; c.globalAlpha = .25; c.lineWidth = 1; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0 + gw, y0); c.stroke();
  c.globalAlpha = 1; c.lineWidth = 2.5; c.beginPath();
  for (let i = 0; i <= 120; i++) { const t = span * i / 120, x = x0 + gw * i / 120;
    const dB = t < pre ? -60 : Math.max(-60, -60 * (t - pre) / dec); const y = y0 - gh * (dB + 60) / 60; i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke();
  if (f && f.env) { c.globalAlpha = .45; const bw = gw / 48; f.env.forEach((v, i) => { const a = Math.min(1, Math.max(0, (20 * Math.log10(v + 1e-6) + 60) / 60)) * gh; c.fillRect(x0 + i * bw, y0 - a, bw - 1, a); }); }
  c.globalAlpha = 1; c.font = "700 13px " + RL.css("--ui"); c.textBaseline = "top"; c.fillStyle = ink;
  c.fillText(["ROOM", "HALL", "PLATE"][Math.round(RL.P("type"))] + (RL.P("freeze") > .5 ? " · BYPASS (queue)" : "") + `  ·  RT60 ${dec.toFixed(2)} s`, 14, 12);
  c.textBaseline = "bottom"; c.fillText("0 s", x0, h - 8); c.textAlign = "right"; c.fillText(span.toFixed(1) + " s", x0 + gw, h - 8); c.textAlign = "left";
}
RL.start(layout);
</script></body></html>
