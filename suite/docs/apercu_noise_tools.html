<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Noise Tools — Room Labs Audio</title>
<style>/* Room Labs Audio — feuille commune des plugins (thèmes Vert, Studio, Pocket) */
:root{--ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
[data-theme=vert]{--bg:#050807;--acc:#3ce6a0;--acc2:#8affcf;--ink:#d4efe3;--ink2:#7fb9a1;--scr:#04100c;--scrInk:#46f2ac;--grid:rgba(60,230,160,.13);--glow:rgba(60,230,160,.55);--menu:#0b1a15;--line:#2b6b53}
[data-theme=studio]{--bg:#0b0c0e;--acc:#e9edf1;--acc2:#ffffff;--ink:#dde2e7;--ink2:#8d969f;--scr:#0c0e10;--scrInk:#eef2f6;--grid:rgba(230,236,242,.10);--glow:rgba(230,236,242,.35);--menu:#16191c;--line:#5b636b}
[data-theme=pocket]{--bg:#d9d6cf;--acc:#111214;--acc2:#3a3d40;--ink:#1c1d1f;--ink2:#5d5f62;--scr:#16181a;--scrInk:#f1eee6;--grid:rgba(240,236,228,.10);--glow:rgba(0,0,0,.25);--menu:#f1efe9;--line:#8f8c85}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--ui)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage>img.face,#stage>img.cadres{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#stage>img.cadres{z-index:3}
.el{position:absolute;z-index:4}
.scr{position:absolute;z-index:3;overflow:hidden;border-radius:10px}
.scr canvas{position:absolute;inset:0;width:100%;height:100%}
.scr .ttl{position:absolute;left:0;right:0;top:9px;text-align:center;font:800 12px var(--ui);letter-spacing:2px;color:var(--scrInk);opacity:.9}
.scr .val{position:absolute;left:0;right:0;text-align:center;font:700 13px var(--ui);color:var(--scrInk);font-variant-numeric:tabular-nums}
/* en-tête : logo, titre, aide, thème */
.hdr{position:absolute;z-index:5;display:flex;align-items:center;gap:12px;color:var(--ink)}
.hdr .logo{display:flex;align-items:center;gap:8px}
.hdr .logo svg{width:30px;height:30px}
.hdr .brand{font:800 11px/1.05 var(--ui);letter-spacing:1.4px}
.hdr .sep{width:1px;height:30px;background:var(--ink2);opacity:.6}
.hdr .name{font:700 21px var(--ui);letter-spacing:1.5px}
.hbtns{position:absolute;z-index:5;display:flex;gap:8px;align-items:center}
.ib{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink2);background:transparent;color:var(--ink);font:800 13px var(--ui);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s,box-shadow .15s}
.ib:hover{border-color:var(--acc);box-shadow:0 0 10px var(--glow)}
.ib svg{width:16px;height:16px}
.thm{height:28px;border-radius:14px;padding:0 10px;width:auto;font:800 11px var(--ui);letter-spacing:1px;gap:6px}
.thm i{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--glow)}
/* molette : sprite + indicateur et arc dessinés */
.kn{display:flex;flex-direction:column;align-items:center;cursor:ns-resize;touch-action:none}
.kn .body{position:relative}
.kn .body img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kn .body svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.kn .lbl{font:800 12px var(--ui);letter-spacing:1.2px;color:var(--ink);text-transform:uppercase;margin-top:2px;white-space:nowrap}
.kn .v{font:600 12px var(--ui);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.kn:hover .body{filter:brightness(1.08)}
.kn.off{opacity:.42;filter:saturate(.4)}
/* touche : sprite éteint / allumé + libellé */
.ky{cursor:pointer}
.ky img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .18s}
.ky img.on{opacity:0}.ky.on img.on{opacity:1}.ky.on img.off{opacity:0}
.ky span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 12px var(--ui);letter-spacing:1.3px;color:var(--ink2);text-transform:uppercase;white-space:nowrap;padding-top:1px}
.ky.on span{color:var(--ink)}
/* voyant de touche */
.ky span::before{transition:opacity .18s,transform .18s,width .18s,margin .18s;content:"";width:0;height:7px;border-radius:50%;margin-right:0;background:var(--acc);opacity:0;transform:scale(.4);box-shadow:0 0 8px var(--glow);flex:none}
.ky.on span::before{opacity:1;transform:none;width:7px;margin-right:8px}
.ky.nodot span::before{display:none}
[data-theme=vert] .ky.on span{color:#eafff6;text-shadow:0 0 8px var(--glow)}
.ky:hover img{filter:brightness(1.12)}
.ky:active{transform:translateY(1px)}
.ky.sel span{font-size:12px;letter-spacing:.6px}
.led{pointer-events:none;transition:opacity .12s,filter .12s}
.led.dim{opacity:.35;filter:saturate(.2)}
.tlbl{font:800 12px var(--ui);letter-spacing:1.4px;color:var(--ink);text-transform:uppercase;white-space:nowrap}
.pop{position:absolute;z-index:20;background:var(--menu);color:var(--ink);border-radius:10px;padding:6px;box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .14s,transform .14s;font:600 13px var(--ui)}
[data-theme=pocket] .pop{color:#1c1d1f}
.pop.show{opacity:1;pointer-events:auto;transform:none}
.pop .it{padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.pop .it:hover{background:rgba(128,128,128,.2)}
.pop .it.on{background:var(--acc);color:var(--bg);font-weight:800}
.pop h4{margin:4px 8px;font:800 11px var(--ui);letter-spacing:1.4px;opacity:.7}
#veil{position:absolute;inset:0;z-index:19;display:none}
#veil.show{display:block}
#toast{position:absolute;z-index:30;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#eee;font:600 12px var(--ui);padding:7px 12px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#tip{position:absolute;z-index:31;background:#111;color:#eee;font:500 12px var(--ui);padding:5px 8px;border-radius:6px;max-width:260px;pointer-events:none;opacity:0;transition:opacity .15s}
#tip.show{opacity:.95}
/* ---------- relief (commun à la suite) : lumière venant du haut, ombres portées, verre ---------- */
#stage>img.cadres{filter:drop-shadow(0 10px 14px rgba(0,0,0,.55)) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
[data-theme=vert] #stage>img.cadres{filter:drop-shadow(0 0 6px rgba(60,230,160,.18)) drop-shadow(0 10px 14px rgba(0,0,0,.6))}
[data-theme=pocket] #stage>img.cadres{filter:drop-shadow(0 8px 12px rgba(60,50,30,.28)) drop-shadow(0 1px 2px rgba(0,0,0,.25))}
#light{position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:22px;
  background:radial-gradient(120% 70% at 50% -10%,rgba(255,255,255,.10),transparent 60%),radial-gradient(140% 90% at 50% 120%,rgba(0,0,0,.35),transparent 60%)}
[data-theme=vert] #light{background:radial-gradient(110% 65% at 50% -8%,rgba(90,255,190,.13),transparent 60%),radial-gradient(140% 90% at 50% 125%,rgba(0,0,0,.45),transparent 60%)}
[data-theme=pocket] #light{background:radial-gradient(120% 70% at 50% -10%,rgba(255,255,255,.55),transparent 60%),radial-gradient(140% 90% at 50% 125%,rgba(70,60,40,.18),transparent 60%)}
.scr{box-shadow:inset 0 2px 8px rgba(0,0,0,.85),inset 0 0 0 1px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06)}
.scr::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(172deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 28%,transparent 29%),
             repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
[data-theme=vert] .scr{box-shadow:inset 0 2px 10px rgba(0,0,0,.9),inset 0 0 0 1px rgba(60,230,160,.22),0 0 12px rgba(60,230,160,.10)}
.kn .body::before{content:"";position:absolute;left:12%;right:12%;bottom:-6%;height:22%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);filter:blur(3px)}
[data-theme=pocket] .kn .body::before{background:radial-gradient(closest-side,rgba(60,45,20,.35),transparent)}
.kn .body img{filter:drop-shadow(0 5px 6px rgba(0,0,0,.55))}
[data-theme=pocket] .kn .body img{filter:drop-shadow(0 5px 6px rgba(70,55,30,.35))}
.kn .body::after{content:"";position:absolute;inset:18%;border-radius:50%;pointer-events:none;background:radial-gradient(60% 45% at 35% 25%,rgba(255,255,255,.16),transparent 70%)}
.ky{filter:drop-shadow(0 4px 5px rgba(0,0,0,.5));transition:transform .08s,filter .08s}
[data-theme=pocket] .ky{filter:drop-shadow(0 4px 5px rgba(70,55,30,.3))}
.ky:active{transform:translateY(2px);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.ky.on{filter:drop-shadow(0 4px 5px rgba(0,0,0,.5)) drop-shadow(0 0 7px var(--glow))}
.hdr .logo svg{filter:drop-shadow(0 0 6px var(--glow))}
.hdr .name{background:linear-gradient(180deg,var(--acc2),var(--ink) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
[data-theme=pocket] .hdr .name{background:none;color:var(--ink);filter:none}
.ib{box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
</style>
<style>
  .valbox{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:17px;border:1.5px solid var(--line);color:var(--ink);font:800 12px var(--ui);letter-spacing:1.2px;cursor:ns-resize;touch-action:none;transition:border-color .15s,box-shadow .15s}
  .valbox:hover{border-color:var(--acc);box-shadow:0 0 10px var(--glow)}
  .valbox b{font:700 13px var(--ui);color:var(--acc);font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
  [data-theme=pocket] .valbox b{color:var(--ink)}
  .mod{transition:opacity .25s,filter .25s}
  .mod.off{opacity:.4;filter:saturate(.35)}
  .stat{position:absolute;z-index:5;text-align:center;font:600 12px var(--ui);color:var(--ink2);pointer-events:none;font-variant-numeric:tabular-nums}
  .stat b{display:block;font:800 20px var(--ui);color:var(--ink);letter-spacing:.5px}
  [data-theme=vert] .stat b{color:#eafff6;text-shadow:0 0 10px var(--glow)}
  .ky.learn.on{animation:blink 1s infinite}
  @keyframes blink{50%{filter:brightness(1.35)}}
</style>
</head>

function drawDenoise(c, w, h, f) {
  c.fillStyle = C("--scr"); roundRect(c, 0, 0, w, h, 8); c.fill(); grid(c, w, h - 26);
  const H = h - 26, top = -10, bot = -100, Y = v => Math.max(0, Math.min(H, (top - v) / (top - bot) * H));

    const si = sm("si", f.si), so = sm("so", f.so), nz = sm("nz", f.nz), X = i => i / 31 * w, ink = C("--scrInk");
    // sortie : aire remplie
    c.beginPath(); c.moveTo(0, H); so.forEach((v, i) => c.lineTo(X(i), Y(v))); c.lineTo(w, H); c.closePath();
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, ink); g.addColorStop(1, "transparent"); c.globalAlpha = .35; c.fillStyle = g; c.fill(); c.globalAlpha = 1;
    c.strokeStyle = ink; c.lineWidth = 1.8; c.shadowColor = ink; c.shadowBlur = 8; c.beginPath(); so.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(0, Y(v))); c.stroke();
    c.shadowBlur = 0;
    // entrée : ligne fine
    c.globalAlpha = .45; c.lineWidth = 1; c.beginPath(); si.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(0, Y(v))); c.stroke();

    c.setLineDash([3, 3]); c.globalAlpha = .8; c.strokeStyle = "#ffb347"; c.beginPath(); nz.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(0, Y(v))); c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
  }
  c.fillStyle = C("--scrInk"); c.font = "700 11px " + C("--ui"); c.textBaseline = "middle";
  c.globalAlpha = .7; c.fillText("RÉDUCTION", 10, h - 12); c.globalAlpha = 1;
  c.textAlign = "right"; c.font = "800 13px " + C("--ui"); c.fillText(((smooth.red = (smooth.red ?? 0) + .2 * ((f.red || 0) - (smooth.red ?? 0)))).toFixed(1) + " dB", w - 10, h - 12); c.textAlign = "left";
}
const hist = { cps: new Array(90).fill(0), clps: new Array(90).fill(0) }; let histT = 0;
function drawActivity(c, w, h, f, key, title) {
  const now = performance.now(); if (key === "cps" && now - histT > 100) { histT = now; hist.cps.push(f.cps || 0); hist.cps.shift(); hist.clps.push(f.clps || 0); hist.clps.shift(); }
  c.fillStyle = C("--scr"); roundRect(c, 0, 0, w, h, 8); c.fill();

  const cols = 30, cw = w / cols, rows = 16, rh = (H - 8) / rows;
  for (let ci = 0; ci < cols; ci++) {
    const v = Math.max(...a.slice(ci * 3, ci * 3 + 3)), on = Math.round(v / mx * rows);
    for (let r = 0; r < rows; r++) {
      const lit = r < on; c.fillStyle = ink;

      c.fillRect(ci * cw + 1, H - (r + 1) * rh, cw - 2, rh - 1.2);

  c.shadowBlur = 0;
  c.globalAlpha = 1; c.font = "700 11px " + C("--ui"); c.textBaseline = "middle";
  c.globalAlpha = .7; c.fillText(title, 10, h - 12); c.globalAlpha = 1;
  c.textAlign = "right"; c.font = "800 13px " + C("--ui"); c.fillText(String(Math.round(a[a.length - 1])), w - 10, h - 12); c.textAlign = "left";
}
