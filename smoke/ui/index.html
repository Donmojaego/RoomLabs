<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoke · Room Labs Audio</title>
<style>
:root{--acc:#ff8f73;--acc2:#ffc4b2;--ink:#f7e3dc;--dim:#c9a9a3;--panel:rgba(26,10,22,.92);--line:rgba(255,170,150,.28)}
body.bleu{--acc:#7cc4ff;--acc2:#c6e6ff;--ink:#e6f1fb;--dim:#a7b9cb;--panel:rgba(8,16,30,.92);--line:rgba(140,200,255,.28)}
body.vert{--acc:#7fe3a8;--acc2:#c9f5da;--ink:#e6f6ec;--dim:#a6c7b3;--panel:rgba(8,24,16,.92);--line:rgba(140,240,180,.28)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0d070c;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;overflow:hidden}
.abs{position:absolute}
#bg{left:0;top:0;width:1000px;height:640px;object-fit:cover}
body.bleu #bg,body.bleu .tint{filter:hue-rotate(195deg) saturate(.85)}
body.vert #bg,body.vert .tint{filter:hue-rotate(112deg) saturate(.8)}
#shade{left:0;top:0;width:1000px;height:640px;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 30%,rgba(0,0,0,.45) 100%);pointer-events:none}

/* barre du haut */
#logo{left:20px;top:8px;height:62px}
#lockup{left:22px;top:612px;height:0}
#nav{left:300px;top:14px;width:400px;height:52px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.25));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.45);display:flex;align-items:center}
#nav button{width:46px;height:46px;margin:0 3px;border:0;border-radius:50%;background:transparent;color:var(--acc2);font-size:20px;cursor:pointer;transition:background .15s}
#nav button:hover{background:rgba(255,255,255,.08)}
#pname{flex:1;text-align:center;cursor:pointer;line-height:1.15;padding:2px 0}
#pname b{display:block;font-size:19px;font-weight:600;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pname span{display:block;font-size:12px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
.ico{top:16px;width:48px;height:48px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.3));border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .12s,box-shadow .2s}
.ico:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.5),0 0 12px color-mix(in srgb,var(--acc) 40%,transparent)}
.ico img{max-width:28px;max-height:28px}
.ico.on{box-shadow:0 0 0 2px var(--acc),0 0 18px color-mix(in srgb,var(--acc) 60%,transparent)}
.ico.off img{opacity:.45}
#bEq{left:766px}#bGear{left:842px}#bPow{left:918px}
.ico .cap{position:absolute;top:52px;left:-16px;right:-16px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--ink);text-shadow:0 1px 3px #000;pointer-events:none;white-space:nowrap}
#bPow .cap b{color:var(--acc2)}
.puff{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;filter:blur(1.5px);pointer-events:none;background-size:contain;background-repeat:no-repeat;background-position:center;mix-blend-mode:screen;will-change:transform,opacity;animation:puff 2.4s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}15%{opacity:var(--op,.45)}100%{opacity:0;transform:translate(var(--dx),-150px) scale(1.35) rotate(var(--rot))}}

/* banques */
.bank{left:22px;width:204px;height:84px;cursor:pointer}
.bank img{position:absolute;left:0;top:0;width:204px;height:84px;object-fit:fill;transition:opacity .25s}
.bank .hi{opacity:0;left:-4px;top:-6px;width:212px;height:96px}
.bank.on .hi{opacity:1}.bank.on .lo{opacity:0}
.bank b{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px;letter-spacing:5px;font-weight:700;color:var(--ink);text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.6);transition:color .2s,text-shadow .2s}
.bank.on b{color:#fff;text-shadow:0 0 12px var(--acc),0 1px 3px #000}
.bank:active{transform:translateY(1px) scale(.99)}

/* accords */
#chords{left:22px;top:470px;width:204px}
.lab{font-size:13px;letter-spacing:3px;color:var(--dim);font-weight:600;text-transform:uppercase}
#chords .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.chip{height:34px;border-radius:17px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.3));color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.35);transition:all .15s}
.chip:hover{border-color:var(--acc)}
.chip.on{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 55%,#000),color-mix(in srgb,var(--acc) 25%,#000));color:#fff;border-color:var(--acc);box-shadow:0 0 14px color-mix(in srgb,var(--acc) 55%,transparent)}

/* scène : yeux, joint, fumée */
#eyes{left:290px;top:84px;width:420px;height:200px;will-change:filter}
#eyes img{position:absolute;left:0;width:420px;top:50%;transform:translateY(-50%);-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%)}
#eyesRed{opacity:0}
#haze{left:250px;top:70px;width:500px;height:240px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,200,190,.22),rgba(255,200,190,0) 70%);opacity:0;pointer-events:none}
body.bleu #haze{background:radial-gradient(ellipse,rgba(190,220,255,.22),rgba(190,220,255,0) 70%)}
body.vert #haze{background:radial-gradient(ellipse,rgba(190,255,215,.22),rgba(190,255,215,0) 70%)}
#joint{pointer-events:none}
#ember{width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(circle,rgba(255,220,160,1) 0,rgba(255,120,40,.85) 22%,rgba(255,60,20,.35) 48%,rgba(255,40,10,0) 72%);mix-blend-mode:screen;opacity:.3;pointer-events:none;will-change:opacity,transform}
#fx{left:230px;top:60px;width:540px;height:530px;pointer-events:none}
#smoke{left:0;top:0;width:1000px;height:640px;pointer-events:none}

/* molettes */
.knob{cursor:ns-resize;touch-action:none}
.knob::before{content:"";position:absolute;inset:-24px -30px -52px -30px;border-radius:40px}   /* zone de prise agrandie (molette + nom + valeur) */
.knob img,.ico img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.knob:hover .ring{filter:drop-shadow(0 0 7px var(--acc))}
.knob .face{position:absolute;left:0;top:0;width:100%;height:100%}
.knob svg{position:absolute;left:-8%;top:-8%;width:116%;height:116%;overflow:visible;pointer-events:none}
.knob .ring{fill:none;stroke:var(--acc);stroke-linecap:round;filter:drop-shadow(0 0 4px var(--acc))}
.knob .track{fill:none;stroke:rgba(255,255,255,.08);stroke-linecap:round}
.kl{position:absolute;left:-30px;right:-30px;text-align:center;font-size:15px;font-weight:700;letter-spacing:4px;color:var(--ink);text-shadow:0 1px 3px #000}
.kv{position:absolute;left:-30px;right:-30px;text-align:center;font-size:13px;color:var(--acc2);font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}

/* clavier */
#keys{left:22px;top:592px;width:956px;height:42px;border-radius:8px;overflow:hidden;box-shadow:0 -2px 12px rgba(0,0,0,.5),inset 0 0 0 1px var(--line);touch-action:none}
.wk{position:absolute;top:0;height:42px;background:linear-gradient(180deg,#e9dcd8,#cbbab6);border-right:1px solid #6d5a58;font-size:12px;color:#4a3230;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;font-weight:600}
.bk{position:absolute;top:0;height:26px;background:linear-gradient(180deg,#2b1a22,#120a0e);border-radius:0 0 4px 4px;z-index:2;box-shadow:0 2px 3px rgba(0,0,0,.6)}
.wk.dn{background:linear-gradient(180deg,var(--acc2),var(--acc))}
.bk.dn{background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 45%,#000))}

/* panneaux */
.panel{overflow-y:auto;left:236px;top:82px;width:528px;height:496px;border-radius:22px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.6);padding:20px 26px;display:none;z-index:20;backdrop-filter:blur(6px)}
.panel.open{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.panel h2{margin:0 0 14px;font-size:18px;letter-spacing:4px;font-weight:700;text-transform:uppercase;color:var(--acc2)}
.panel .x{position:absolute;right:14px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:18px;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;margin:9px 0}
.row .lab{width:118px;font-size:13px;letter-spacing:1.5px}
.row .val{width:82px;text-align:right;font-size:14px;color:var(--acc2);font-variant-numeric:tabular-nums}
.sl{flex:1;height:26px;position:relative;cursor:ew-resize;touch-action:none}
.sl .tr{position:absolute;left:0;right:0;top:11px;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
.sl .fi{position:absolute;left:0;top:11px;height:5px;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 40%,#000),var(--acc));box-shadow:0 0 8px color-mix(in srgb,var(--acc) 60%,transparent)}
.sl .th{position:absolute;top:4px;width:19px;height:19px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,var(--acc2) 45%,var(--acc));box-shadow:0 2px 6px rgba(0,0,0,.6)}
.seg{display:flex;flex-wrap:wrap;gap:7px;flex:1}
.seg .chip{padding:0 12px}
#list{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 12px;max-height:410px;overflow:auto}
#list .hd{font-size:13px;letter-spacing:3px;color:var(--acc);font-weight:700;margin:2px 0 4px}
#list .it{font-size:14px;padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .it:hover{background:rgba(255,255,255,.07)}
#list .it.on{background:color-mix(in srgb,var(--acc) 30%,transparent);color:#fff}
#toast{left:350px;top:72px;width:300px;text-align:center;font-size:14px;padding:7px 12px;border-radius:16px;background:rgba(0,0,0,.6);opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#hint{left:240px;top:572px;width:520px;text-align:center;font-size:12px;color:var(--dim);pointer-events:none}
#perf{left:6px;top:6px;font:12px monospace;background:#000c;color:#fff;padding:4px 7px;border-radius:6px;display:none;z-index:50;white-space:pre}
.ver{font-size:13px;color:var(--dim);margin-top:18px;line-height:1.6}
</style>
</head>
<body class="prune">
<div id="stage">
  <img id="bg" class="abs" data-src="bg.webp" alt="">
  <div id="shade" class="abs"></div>

  <div id="haze" class="abs"></div>
  <div id="eyes" class="abs"><img id="eyesN" alt=""><img id="eyesRed" alt=""></div>
  <img id="joint" class="abs" alt="">
  <canvas id="smoke" class="abs"></canvas>
  <canvas id="fx" class="abs"></canvas>
  <div id="ember" class="abs"></div>

  <img id="logo" class="abs" alt="Smoke">
  <div id="nav" class="abs"><button id="prev" title="Preset précédent">◀</button><div id="pname" title="Liste des presets"><b>—</b><span>—</span></div><button id="next" title="Preset suivant">▶</button></div>
  <div id="bEq" class="abs ico" title="Réglages du son"><img class="tint" data-src="icon_eq.webp" alt=""><span class="cap">SON</span></div>
  <div id="bGear" class="abs ico" title="Préférences et licence"><img class="tint" data-src="icon_gear.webp" alt=""><span class="cap">RÉGLAGES</span></div>
  <div id="bPow" class="abs ico tint on" title="Animation de la fumée : marche / arrêt"><img class="tint" data-src="icon_power.webp" alt=""><span class="cap">ANIM. <b id="powState">ON</b></span></div>

  <div id="banks"></div>
  <div id="chords" class="abs"><div class="lab">Accord</div><div class="grid"></div></div>
  <div id="knobs"></div>
  <div id="keys" class="abs"></div>

  <div id="pSound" class="abs panel"><button class="x">✕</button><h2>Son</h2><div id="soundRows"></div></div>
  <div id="pPrefs" class="abs panel"><button class="x">✕</button><h2>Préférences</h2>
    <div class="row"><div class="lab">Thème</div><div class="seg" data-pref="theme"><div class="chip" data-val="prune">Prune</div><div class="chip" data-val="bleu">Bleu</div><div class="chip" data-val="vert">Vert</div></div></div>
    <div class="row"><div class="lab">Animation</div><div class="seg" data-pref="visual"><div class="chip" data-val="anime">Animé</div><div class="chip" data-val="reduit">Réduit</div><div class="chip" data-val="statique">Statique</div></div></div>
    <div class="row"><div class="lab">Taille</div><div class="seg" data-pref="zoom"><div class="chip" data-val="75">75 %</div><div class="chip" data-val="100">100 %</div><div class="chip" data-val="125">125 %</div><div class="chip" data-val="150">150 %</div></div></div>
    <div class="ver" id="ver"></div>
    <div id="licBox"></div>
  </div>
  <div id="pList" class="abs panel"><button class="x">✕</button><h2>Presets</h2><div id="list"></div></div>

  <div id="toast" class="abs"></div>
  <div id="hint" class="abs"></div>
  <div id="perf" class="abs"></div>
</div>
<script src="rl_license_ui.js"></script>
<script>
"use strict";
// =============================================================================
// Pont avec le plugin (JUCE) ; sans plugin : aperçu WebAudio approximatif
// =============================================================================
const NATIVE = !!(window.__JUCE__ && window.__JUCE__.backend);
const call = NATIVE ? (() => { let n = 0; const pend = new Map();
  window.__JUCE__.backend.addEventListener("__juce__complete", ({promiseId, result}) => { const f = pend.get(promiseId); if (f) { pend.delete(promiseId); f(result); } });
  return (name, ...params) => new Promise(res => { const id = n++; pend.set(id, res); window.__JUCE__.backend.emitEvent("__juce__invoke", {name, params, resultId: id}); });
})() : null;
const initPrefs = NATIVE ? ((window.__JUCE__.initialisationData.prefs || [])[0] || {}) : {};
const VERSION = NATIVE ? ((window.__JUCE__.initialisationData.version || [])[0] || "") : "aperçu";
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const ASSET = n => (window.SHK_ASSETS && window.SHK_ASSETS[n]) || ("assets/" + n);
const toast = t => { const e = $("#toast"); e.textContent = t; e.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.opacity = 0, 1500); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// ---- paramètres (mêmes identifiants et plages que source/Params.h)
const pct = v => Math.round(v * 100) + " %", ms = v => v < 1000 ? Math.round(v) + " ms" : (v / 1000).toFixed(2) + " s";
const PDEF = {
  tone:{min:0,max:1,def:.7,skew:1,fmt:pct,label:"TONE"}, space:{min:0,max:1,def:.3,skew:1,fmt:pct,label:"SPACE"},
  mod:{min:0,max:1,def:.3,skew:1,fmt:pct,label:"MOD"}, dream:{min:0,max:1,def:.2,skew:1,fmt:pct,label:"DREAM"},
  clean:{min:0,max:1,def:.5,skew:1,fmt:pct,label:"CLEAN"}, level:{min:-30,max:12,def:-6,skew:1,fmt:v => (v > 0 ? "+" : "") + v.toFixed(1) + " dB",label:"Niveau preset"},
  master:{min:-24,max:6,def:0,skew:1,fmt:v => (v > 0 ? "+" : "") + v.toFixed(1) + " dB",label:"MASTER"},
  attack:{min:0,max:5000,def:5,skew:.3,fmt:ms,label:"Attaque"}, decay:{min:5,max:8000,def:1500,skew:.3,fmt:ms,label:"Decay"},
  sustain:{min:0,max:1,def:.6,skew:1,fmt:pct,label:"Tenue"}, release:{min:5,max:12000,def:500,skew:.3,fmt:ms,label:"Relâchement"},
  bright:{min:0,max:1,def:.5,skew:1,fmt:pct,label:"Couleur"}, tremolo:{min:0,max:1,def:0,skew:1,fmt:pct,label:"Trémolo"},
  rise:{min:.5,max:16,def:4,skew:.5,fmt:v => v.toFixed(1) + " s",label:"Montée"}, glide:{min:0,max:1000,def:80,skew:.4,fmt:ms,label:"Glisse"},
  tune:{min:-24,max:24,def:0,skew:1,fmt:v => (v > 0 ? "+" : "") + v.toFixed(1) + " st",label:"Accordage"}};
const MODELS = ["Rhodes","Piano feutré","Nappe","Riser","Sub","Basse house"];
const CHORDS = ["Off","m9","maj9","m11","9","maj7"];
const P = {model:0, chord:0}; for (const k in PDEF) P[k] = PDEF[k].def;
const toN = (k, v) => { const d = PDEF[k]; return Math.pow(clamp((v - d.min) / (d.max - d.min), 0, 1), d.skew); };
const fromN = (k, n) => { const d = PDEF[k]; return d.min + (d.max - d.min) * Math.pow(clamp(n, 0, 1), 1 / d.skew); };

let presets = [], current = 0, bank = 0, BANKS = ["Keys","Rhodes","Risers","Sub"];
const prefs = Object.assign({theme:"prune", zoom:100, visual:"anime"}, initPrefs);
const NOTE = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FACE_WIDE = {n:"yeux_normaux.webp", r:"yeux_rouges.webp", box:[290, 84, 420, 200]};
const THEME = {prune:{logo:"logo_prune.webp", joint:"joint_papier.webp", smoke:"fumee_prune.webp", tip:[.955,.07], ar:708 / 900, face:FACE_WIDE},
               bleu: {logo:"logo_bleu.webp",  joint:"joint_woodback.webp", smoke:"fumee_bleu.webp", tip:[.93,.09], ar:546 / 900, face:{n:"visage_bleu.webp", r:"visage_bleu_intense.webp", box:[345, 70, 310, 284]}},
               vert: {logo:"logo_vert.webp",  joint:"joint_vert.webp", smoke:"fumee_vert.webp", tip:[.96,.05], ar:835 / 900, face:{n:"visage_vert.webp", r:"visage_vert_intense.webp", box:[345, 70, 310, 284]}}};
const TIP = [585, 338];        // position fixe de la braise sur la scène (le joint s'aligne dessus)
let stageScale = 1;
const fit = () => { stageScale = Math.min(innerWidth / 1000, innerHeight / 640); $("#stage").style.transform = `scale(${stageScale})`; fx.resize(); };
addEventListener("resize", () => fit());

// =============================================================================
// Envoi des réglages
// =============================================================================
const ui = {};   // id -> fonction de mise à jour de l'affichage
function setParam(k, v, fromHost) {
  P[k] = v; if (ui[k]) ui[k](v);
  if (!fromHost && NATIVE) call("setParam", k, v);
  if (k === "space" || k === "dream" || k === "mod" || k === "clean") anim.wake("param");
}
const gesture = (k, on) => { if (NATIVE) call("gesture", k, on); };

// ---- molettes (images de la maquette qui tournent + anneau de valeur)
function knob(id, x, y, size, img) {
  const el = document.createElement("div"); el.className = "abs knob"; Object.assign(el.style, {left: x - size / 2 + "px", top: y - size / 2 + "px", width: size + "px", height: size + "px"});
  const r = 54, a0 = 135, sweep = 270, pol = a => { const t = (a - 90) * Math.PI / 180; return [60 + r * Math.cos(t), 60 + r * Math.sin(t)]; };
  const arc = (a1, a2) => { const [x1, y1] = pol(a1), [x2, y2] = pol(a2); return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`; };
  el.innerHTML = `<img class="face tint" src="${ASSET(img)}" alt="" draggable="false"><svg viewBox="0 0 120 120"><path class="track" stroke-width="3.2" d="${arc(-a0, -a0 + sweep)}"/><path class="ring" stroke-width="3.6" d=""/><g class="ptr"><line x1="60" y1="${size > 120 ? 30 : 27}" x2="60" y2="${size > 120 ? 17 : 19}" stroke="var(--acc2)" stroke-width="${size > 120 ? 3.4 : 4.2}" stroke-linecap="round" style="filter:drop-shadow(0 0 3px var(--acc))"/></g></svg>
    <div class="kl" style="top:${size + 4}px">${PDEF[id].label}</div><div class="kv" style="top:${size + 24}px"></div>`;
  $("#knobs").appendChild(el);
  const ptr = el.querySelector(".ptr"), ring = el.querySelector(".ring"), kv = el.querySelector(".kv");
  ui[id] = v => { const n = toN(id, v), a = -a0 + sweep * n; ptr.setAttribute("transform", `rotate(${a.toFixed(1)} 60 60)`); ring.setAttribute("d", n > .002 ? arc(-a0, a) : ""); kv.textContent = PDEF[id].fmt(v); };
  let sy = 0, sn = 0;
  let moved = 0;
  el.addEventListener("dragstart", e => e.preventDefault());
  el.addEventListener("pointerdown", e => { e.preventDefault(); el.setPointerCapture(e.pointerId); sy = e.clientY; sn = toN(id, P[id]); gesture(id, true); smokeAt(el, .7, 8); });

      s: size * (.8 + Math.random() * .4), a: alpha, rot: (Math.random() - .5) * .6, vr: (Math.random() - .5) * .5, ph: Math.random() * 6, flip: Math.random() < .5 ? -1 : 1});

const fx = smokeGL || fxSprite;
if (smokeGL) $("#fx").style.display = "none";
// une commande touchée fume aussi
function smokeAt(el, s = .6, dy = 0) {

  const r = el.getBoundingClientRect(), st = $("#stage").getBoundingClientRect();
  fx.puffAt((r.left + r.width / 2 - st.left) / stageScale, (r.top - st.top) / stageScale + dy, s); anim.wake("touch");
}

// =============================================================================
// Boucle d'animation unique : braise, fumée, yeux qui rougissent, brume.
// Arrêt automatique 1 s après le silence ; mode Statique = aucune image animée.
// =============================================================================
const anim = (() => {
  let running = false, last = 0, idle = 0, e = 0, red = 0, blurQ = -1, emberQ = -1, redQ = -1, hazeQ = -1;
