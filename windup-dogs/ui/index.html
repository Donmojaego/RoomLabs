<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windup Dogs · Room Labs Audio</title>
<style>
:root{--gold:#f3d79b;--gold2:#ffe7b0;--brass:#c9a227;--ink:#2a1a08;--teal:#0f3b40;--red:#a3262e;--panel:rgba(10,32,35,.95);--line:rgba(243,215,155,.35)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#070d0e;font-family:Georgia,"Times New Roman",serif;color:var(--gold)}
#stage{position:absolute;left:0;top:0;width:960px;height:640px;transform-origin:0 0;overflow:hidden}
.abs{position:absolute}
#bg{left:0;top:0;width:960px;height:640px}
.spr{position:absolute;pointer-events:none;will-change:transform}
canvas{position:absolute;pointer-events:none}
.eng{font-weight:700;letter-spacing:2px;color:var(--gold);text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.8);text-transform:uppercase}

/* clé et clochettes cliquables */
.hot{position:absolute;cursor:pointer;border-radius:12px}
.hot:hover{box-shadow:0 0 0 2px rgba(243,215,155,.35),0 0 18px rgba(243,215,155,.25)}

/* couvercle : écran du preset */
#lid{left:690px;top:88px;width:226px;height:94px;display:flex;align-items:center}
#lid button{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid #6b4f14;background:radial-gradient(circle at 40% 35%,#ffe7a8,#c9a227 55%,#7a5a12);color:#2a1a08;font-size:15px;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .1s}
#lid button:active{transform:scale(.94)}
#pname{flex:1;text-align:center;cursor:pointer;padding:0 4px;line-height:1.2}
#pname span{display:block;font-size:12px;letter-spacing:2px;white-space:nowrap;color:#d9b36a;font-weight:700;text-transform:uppercase}
#pname b{display:block;font-size:18px;color:var(--gold2);text-shadow:0 1px 0 #000,0 0 10px rgba(255,200,90,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pname small{display:block;font-size:12px;color:#b8a27a;margin-top:2px}

/* puits gauche : les musiciens */
#dogs{left:40px;top:234px;width:206px;height:152px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:2px 2px}
.dog{position:relative;cursor:pointer;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:2px;transition:background .2s,box-shadow .2s}
.dog img{height:50px;max-width:64px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6)) saturate(.75) brightness(.85);transition:transform .2s,filter .2s;transform-origin:50% 100%}
.dog b{font-size:12px;letter-spacing:1px;margin-top:2px;color:#d8c08a;text-shadow:0 1px 0 #000}
.dog:hover img{filter:drop-shadow(0 3px 3px rgba(0,0,0,.6));transform:translateY(-2px)}
.dog.on{background:radial-gradient(ellipse at 50% 70%,rgba(255,206,110,.22),rgba(255,206,110,0) 70%);box-shadow:inset 0 0 0 1px rgba(243,215,155,.45)}
.dog.on img{filter:drop-shadow(0 0 8px rgba(255,210,120,.55)) drop-shadow(0 3px 3px rgba(0,0,0,.6));transform:scale(1.08)}
.dog.on b{color:var(--gold2)}

/* molettes (puits droit) */
.knob{position:absolute;cursor:ns-resize;touch-action:none}
.knob .ring{position:absolute;left:0;top:0;width:100%}
.knob .cap{position:absolute;will-change:transform}
.knob .lbl{position:absolute;left:-30px;right:-30px;text-align:center;font-size:12px}
.knob .val{position:absolute;left:-30px;right:-30px;text-align:center;font-size:12px;color:#e9d3a2;font-family:"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}

/* curseurs */
.sld{position:absolute;width:30px;cursor:ns-resize;touch-action:none}
.sld img{position:absolute;left:3px;width:24px;height:24px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.7))}
.sld .lbl{position:absolute;left:-22px;right:-22px;text-align:center;font-size:12px;letter-spacing:1px}

/* boutons et plaque */
.btn{position:absolute;width:28px;height:28px;border-radius:50%;cursor:pointer}
.btn img{position:absolute;left:-1px;top:-1px;width:30px;opacity:0;transition:opacity .15s}
.btn.on img{opacity:1}
.btn:active{transform:translateY(1px)}
#plaque{left:688px;top:444px;width:92px;height:54px;color:#3a2608;text-shadow:0 1px 0 rgba(255,240,200,.55);font-weight:700}
#plaque .r1{display:flex;justify-content:space-between;font-size:12px;letter-spacing:0;padding:4px 2px 0}
#plaque .r2{display:flex;align-items:center;gap:5px;font-size:13px;padding:5px 5px 0}
#tdiv{cursor:pointer;padding:0 3px;border-radius:4px;border:1px solid rgba(58,38,8,.45)}
#tdiv:hover{background:rgba(58,38,8,.12)}
#tbar{flex:1;height:8px;border-radius:4px;background:rgba(58,38,8,.25);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
#tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7a1d22,#c9562e,#e8b04a)}

/* clavier : touches jouables posées sur celles de la planche */
#kb{left:290px;top:440px;width:381px;height:78px;touch-action:none}
#kb .w{position:absolute;top:0;height:78px;cursor:pointer}
#kb .b{position:absolute;top:0;height:35px;cursor:pointer;z-index:2;border-radius:0 0 3px 3px}
#kb .w.dn{background:linear-gradient(180deg,rgba(255,214,120,.0),rgba(255,200,90,.42));box-shadow:inset 0 -3px 0 rgba(160,110,20,.5)}
#kb .b.dn{background:linear-gradient(180deg,rgba(255,200,90,.15),rgba(255,190,80,.6))}
#kb .lab{position:absolute;bottom:3px;left:0;right:0;text-align:center;font:600 12px "Segoe UI",Arial,sans-serif;color:#6b5636;pointer-events:none}

#med{left:887px;top:548px;width:40px;height:40px;cursor:pointer;border-radius:50%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6));transition:transform .15s}
#med:hover{transform:rotate(30deg) scale(1.06)}
#hint{left:180px;top:622px;width:600px;text-align:center;font:12px "Segoe UI",Arial,sans-serif;color:#c8b48a;text-shadow:0 1px 2px #000;pointer-events:none}

/* panneaux */
.panel{left:150px;top:70px;width:660px;height:480px;border-radius:22px;background:var(--panel);border:2px solid #b08a2a;box-shadow:0 18px 50px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,230,160,.15);padding:18px 26px;display:none;z-index:20;font-family:"Segoe UI",Arial,sans-serif}
.panel.open{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.panel h2{margin:0 0 12px;font:700 19px Georgia,serif;letter-spacing:4px;text-transform:uppercase;color:var(--gold2)}
.panel .x{position:absolute;right:14px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--gold);font-size:18px;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;margin:8px 0}
.row .lab{width:150px;font-size:13px;letter-spacing:1px;color:#e2c98f;font-weight:600;text-transform:uppercase}
.row .val{width:82px;text-align:right;font-size:14px;color:var(--gold2);font-variant-numeric:tabular-nums}
.sl{flex:1;height:26px;position:relative;cursor:ew-resize;touch-action:none}
.sl .tr{position:absolute;left:0;right:0;top:11px;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
.sl .fi{position:absolute;left:0;top:11px;height:5px;border-radius:3px;background:linear-gradient(90deg,#7a5a12,#e8c46a)}
.sl .th{position:absolute;top:3px;width:21px;height:21px;margin-left:-10px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3cf,#e2b94e 50%,#7a5a12);box-shadow:0 2px 5px rgba(0,0,0,.6)}
.seg{display:flex;flex-wrap:wrap;gap:7px;flex:1}
.chip{height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.3));color:var(--gold);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chip:hover{border-color:var(--gold)}
.chip.on{background:linear-gradient(180deg,#e8c46a,#9c7419);color:#2a1a08;border-color:#ffe7a8;box-shadow:0 0 12px rgba(243,215,155,.4)}
#list{display:grid;grid-template-columns:repeat(5,1fr);gap:4px 10px;max-height:410px;overflow:auto}
#list .hd{font:700 13px Georgia,serif;letter-spacing:1px;color:#e8c46a;margin:2px 0 5px;text-transform:uppercase}
#list .it{font-size:13px;padding:6px 7px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ecdcb8}
#list .it:hover{background:rgba(255,255,255,.07)}
#list .it.on{background:rgba(232,196,106,.3);color:#fff}
.ver{font-size:13px;color:#c8b48a;margin-top:14px;line-height:1.6}
#toast{left:330px;top:196px;width:300px;text-align:center;font:600 14px "Segoe UI",Arial,sans-serif;padding:7px 12px;border-radius:16px;background:rgba(0,0,0,.65);color:var(--gold2);opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#perf{left:6px;top:6px;font:12px monospace;background:#000c;color:#fff;padding:4px 7px;border-radius:6px;display:none;z-index:50;white-space:pre}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" class="abs" data-src="fond.webp" alt="">
  <!-- pièces découpées de la planche -->
  <img id="sDog" class="spr" data-src="chien_batteur.webp" alt="">
  <img id="sKey" class="spr" data-src="cle_haut.webp" alt="">
  <img id="sBellL" class="spr" data-src="cloche_g.webp" alt="">
  <img id="sBellR" class="spr" data-src="cloche_d.webp" alt="">
  <!-- mécanismes animés -->
  <canvas id="cvWin"></canvas>
  <img id="glass" class="spr" data-src="vitre_reflet.webp" alt="">
  <canvas id="cvSpring"></canvas>
  <canvas id="cvHammer"></canvas>
  <canvas id="cvPipes"></canvas>
  <div id="hotKey" class="hot" title="Remonter le jouet (clé)"></div>
  <div id="hotBells" class="hot" title="Clochettes"></div>
  <div id="hotSpring" class="hot" title="Remonter le ressort"></div>

  <div id="lid" class="abs"><button id="prev" title="Preset précédent">◀</button><div id="pname" title="Liste des presets"><span>—</span><b>—</b><small></small></div><button id="next" title="Preset suivant">▶</button></div>
  <div id="dogs" class="abs"></div>
  <div id="knobs"></div>
  <div id="sliders"></div>
  <div id="bWind" class="btn" title="Remonter le jouet (clé)"><img data-src="bouton_rouge_on.webp" alt=""></div>
  <div id="bTick" class="btn" title="Tic-tac au tempo : marche / arrêt"><img data-src="bouton_creme_on.webp" alt=""></div>
  <div id="bSpring" class="btn" title="Ressort qui se détend : marche / arrêt"><img data-src="bouton_vert_on.webp" alt=""></div>
  <div id="plaque" class="abs"><div class="r1"><span>CLÉ</span><span>TIC</span><span>RES.</span></div><div class="r2"><span id="tdiv" title="Division du tic-tac">1/8</span><div id="tbar" title="Tension du ressort"><i></i></div></div></div>
  <div id="kb" class="abs"></div>
  <img id="med" class="abs" data-src="med_reglages.webp" alt="Réglages" title="Réglages">
  <div id="hint" class="abs"></div>

  <div id="pSound" class="abs panel"><button class="x">✕</button><h2>Réglages du jouet</h2><div id="soundRows"></div><div class="ver" id="ver"></div></div>
  <div id="pList" class="abs panel"><button class="x">✕</button><h2>Presets</h2><div id="list"></div></div>
  <div id="toast" class="abs"></div>
  <div id="perf" class="abs"></div>
</div>
<script>
"use strict";
// =============================================================================
// Pont avec le plugin (JUCE) ; sans plugin : aperçu WebAudio approximatif
// =============================================================================
const NATIVE = !!(window.__JUCE__ && window.__JUCE__.backend);
const call = NATIVE ? (() => { let n = 0; const pend = new Map();
  window.__JUCE__.backend.addEventListener("__juce__complete", ({promiseId, result}) => { const f = pend.get(promiseId); if (f) { pend.delete(promiseId); f(result); } });
  return (name, ...params) => new Promise(res => { const id = n++; pend.set(id, res); window.__JUCE__.backend.emitEvent("__juce__invoke", {name, params, resultId: id}); });
})() : null;
const initPrefs = NATIVE ? ((window.__JUCE__.initialisationData.prefs || [])[0] || {}) : {};
const VERSION = NATIVE ? ((window.__JUCE__.initialisationData.version || [])[0] || "") : "aperçu";
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const ASSET = n => (window.WD_ASSETS && window.WD_ASSETS[n]) || ("assets/" + n);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const toast = t => { const e = $("#toast"); e.textContent = t; e.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.opacity = 0, 1500); };
const img = n => { const i = new Image(); i.src = ASSET(n); i.onload = () => anim.wake("img"); return i; };

// ---- paramètres (mêmes identifiants et plages que source/Params.h)
const pct = v => Math.round(v * 100) + " %", ms = v => v < 1000 ? Math.round(v) + " ms" : (v / 1000).toFixed(2) + " s";
const PDEF = {
  tone:{min:0,max:1,def:.75,skew:1,fmt:pct,label:"Tone"}, meca:{min:0,max:1,def:.35,skew:1,fmt:pct,label:"Méca"}, wobble:{min:0,max:1,def:.15,skew:1,fmt:pct,label:"Wobble"},
  echo:{min:0,max:1,def:.15,skew:1,fmt:pct,label:"Écho"}, space:{min:0,max:1,def:.3,skew:1,fmt:pct,label:"Espace"},
  level:{min:-30,max:12,def:-6,skew:1,fmt:v => (v > 0 ? "+" : "") + v.toFixed(1) + " dB",label:"Niveau"},
  attack:{min:0,max:5000,def:1,skew:.3,fmt:ms,label:"Attaque"}, decay:{min:5,max:8000,def:2500,skew:.3,fmt:ms,label:"Résonance"},
  sustain:{min:0,max:1,def:0,skew:1,fmt:pct,label:"Tenue (fanfare)"}, release:{min:5,max:12000,def:600,skew:.3,fmt:ms,label:"Relâchement"},
  bright:{min:0,max:1,def:.5,skew:1,fmt:pct,label:"Couleur"}, tune:{min:-24,max:24,def:0,skew:1,fmt:v => (v > 0 ? "+" : "") + v.toFixed(1) + " st",label:"Accordage"},
  tickLevel:{min:0,max:1,def:.4,skew:1,fmt:pct,label:"Tic-tac"}, swing:{min:0,max:.6,def:0,skew:1,fmt:pct,label:"Swing"},
  springTime:{min:2,max:120,def:40,skew:.5,fmt:v => Math.round(v) + " s",label:"Durée du ressort"}};
const INSTS = ["Boîte à musique","Piano jouet","Clochettes","Fanfare","Tambour"];
const DIVS = ["1/4","1/8","1/16","1/8T"];
const P = {inst:0, tickOn:0, tickDiv:1, springOn:1}; for (const k in PDEF) P[k] = PDEF[k].def;
const toN = (k, v) => { const d = PDEF[k]; return Math.pow(clamp((v - d.min) / (d.max - d.min), 0, 1), d.skew); };
const fromN = (k, n) => { const d = PDEF[k]; return d.min + (d.max - d.min) * Math.pow(clamp(n, 0, 1), 1 / d.skew); };
let presets = [], current = 0, BANKS = INSTS.slice(), L = null, stageScale = 1;
const prefs = Object.assign({zoom:100, visual:"anime"}, initPrefs);

const fit = () => { stageScale = Math.min(innerWidth / 960, innerHeight / 640); $("#stage").style.transform = `scale(${stageScale})`; anim.resize(); };
addEventListener("resize", () => fit());

// =============================================================================
// Envoi des réglages
// =============================================================================
const ui = {};
function setParam(k, v, fromHost) { P[k] = v; if (ui[k]) ui[k](v); if (!fromHost && NATIVE) call("setParam", k, v); }
const gesture = (k, on) => { if (NATIVE) call("gesture", k, on); };
const addUi = (k, f) => { const prev = ui[k]; ui[k] = v => { if (prev) prev(v); f(v); }; };

// ---- molette : couronne fixe, chapeau qui tourne (repère gravé)
function knob(id, cx, cy, size) {
  const M = L.molette, k = size / M.w, el = document.createElement("div"); el.className = "knob";
  Object.assign(el.style, {left: cx - size / 2 + "px", top: cy - M.cy * k + "px", width: size + "px", height: M.h * k + "px"});
  const capD = M.capR * 2 * k;
  el.innerHTML = `<img class="ring" src="${ASSET("molette.webp")}" alt=""><img class="cap" src="${ASSET("molette_chapeau.webp")}" alt="" style="left:${M.cx * k - capD / 2}px;top:${M.cy * k - capD / 2}px;width:${capD}px;height:${capD}px">
    <div class="lbl eng" style="top:${M.h * k - 3}px">${PDEF[id].label}</div><div class="val" style="top:${M.h * k + 10}px"></div>`;
  $("#knobs").appendChild(el);
  const cap = el.querySelector(".cap"), val = el.querySelector(".val");
  addUi(id, v => { cap.style.transform = `rotate(${(-135 + 270 * toN(id, v)).toFixed(1)}deg)`; val.textContent = PDEF[id].fmt(v); });
  let sy = 0, sn = 0;
  el.addEventListener("pointerdown", e => { el.setPointerCapture(e.pointerId); sy = e.clientY; sn = toN(id, P[id]); gesture(id, true); anim.nudge(); });
  el.addEventListener("pointermove", e => { if (!el.hasPointerCapture(e.pointerId)) return; const kk = (e.shiftKey ? .0012 : .0055) / stageScale; sn = clamp(sn + (sy - e.clientY) * kk, 0, 1); sy = e.clientY; setParam(id, fromN(id, sn)); anim.nudge(); });
  const end = e => { if (el.hasPointerCapture(e.pointerId)) { el.releasePointerCapture(e.pointerId); gesture(id, false); } };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("dblclick", () => { gesture(id, true); setParam(id, PDEF[id].def); gesture(id, false); });
  el.addEventListener("wheel", e => { e.preventDefault(); setParam(id, fromN(id, toN(id, P[id]) - Math.sign(e.deltaY) * (e.shiftKey ? .01 : .04))); }, {passive: false});
  ui[id](P[id]);
}
// ---- curseur vertical dans les fentes de la planche
function vslider(id, x, row) {
  const C = L.curseurs, el = document.createElement("div"); el.className = "sld";
  const top = C.top - 4, h = C.bottom - C.top + 8;
  Object.assign(el.style, {left: x - 15 + "px", top: top + "px", height: h + "px"});
  el.innerHTML = `<img src="${ASSET("curseur_bille.webp")}" alt=""><div class="lbl eng" style="top:${h + 1 + row * 13}px">${PDEF[id].label}</div>`;
  $("#sliders").appendChild(el);
  const ball = el.querySelector("img");
  addUi(id, v => { ball.style.top = (1 - toN(id, v)) * (h - 24) + "px"; });
  const at = e => { const r = el.getBoundingClientRect(); return clamp(1 - (e.clientY - r.top - 12 * stageScale) / (r.height - 24 * stageScale), 0, 1); };
  el.addEventListener("pointerdown", e => { el.setPointerCapture(e.pointerId); gesture(id, true); setParam(id, fromN(id, at(e))); anim.nudge(); });
  el.addEventListener("pointermove", e => { if (el.hasPointerCapture(e.pointerId)) { setParam(id, fromN(id, at(e))); anim.nudge(); } });
  const end = e => { if (el.hasPointerCapture(e.pointerId)) { el.releasePointerCapture(e.pointerId); gesture(id, false); } };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("dblclick", () => { gesture(id, true); setParam(id, PDEF[id].def); gesture(id, false); });
  ui[id](P[id]);
}
// ---- curseurs horizontaux et sélecteurs du panneau Réglages
function slider(parent, id) {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<div class="lab">${PDEF[id].label}</div><div class="sl"><div class="tr"></div><div class="fi"></div><div class="th"></div></div><div class="val"></div>`;
  parent.appendChild(row);
  const sl = row.querySelector(".sl"), fi = row.querySelector(".fi"), th = row.querySelector(".th"), val = row.querySelector(".val");
  addUi(id, v => { const n = toN(id, v); fi.style.width = n * 100 + "%"; th.style.left = n * 100 + "%"; val.textContent = PDEF[id].fmt(v); });
  const at = e => { const r = sl.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1); };
  sl.addEventListener("pointerdown", e => { sl.setPointerCapture(e.pointerId); gesture(id, true); setParam(id, fromN(id, at(e))); });
  sl.addEventListener("pointermove", e => { if (sl.hasPointerCapture(e.pointerId)) setParam(id, fromN(id, at(e))); });
  const end = e => { if (sl.hasPointerCapture(e.pointerId)) { sl.releasePointerCapture(e.pointerId); gesture(id, false); } };
  sl.addEventListener("pointerup", end); sl.addEventListener("pointercancel", end);
  sl.addEventListener("dblclick", () => { gesture(id, true); setParam(id, PDEF[id].def); gesture(id, false); });
  ui[id](P[id]);
}
function segment(parent, label, names, get, set) {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<div class="lab">${label}</div><div class="seg">${names.map((n, i) => `<div class="chip" data-i="${i}">${n}</div>`).join("")}</div>`;
  parent.appendChild(row);
  const chips = row.querySelectorAll(".chip"); const upd = () => chips.forEach(c => c.classList.toggle("on", +c.dataset.i === get()));
  chips.forEach(c => c.addEventListener("click", () => { set(+c.dataset.i); upd(); }));
  return upd;
}

// =============================================================================
// Construction de l'interface (positions mesurées sur la planche : layout.json)
// =============================================================================
const place = (el, box) => Object.assign(el.style, {left: box[0] + "px", top: box[1] + "px", width: box[2] - box[0] + "px", height: box[3] - box[1] + "px"});
function build() {

const perf = (() => { let on = false, n = 0, sum = 0, t0 = performance.now(); const el = $("#perf"), log = [];

    sample(ms) { log.push(ms); if (log.length > 20000) log.shift(); n++; sum += ms; const now = performance.now();

    idle() { if (on) el.textContent = "rendu suspendu (au repos)"; } }; })();

// =============================================================================
// Aperçu sans plugin : synthé WebAudio approximatif (son indicatif seulement)
// =============================================================================
const synth = (() => {

    rev = ac.createConvolver(); const len = ac.sampleRate * 2, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4); }

    const f = 440 * Math.pow(2, (n + P.tune - 69 + droop / 100) / 12), g = ac.createGain(), lv = Math.pow(10, P.level / 20) * .18 * (.4 + .6 * v), oscs = [];
    g.connect(out); const sg = ac.createGain(); sg.gain.value = P.space; g.connect(sg); sg.connect(revG);

if (!NATIVE) window.SHK_TEST = {feed: onFb, fbk, perf, setPref, prefs, P, loadPreset, setParam, anim, get current() { return current; }};
